[package]
name = "appliance-credhelper"
version = "0.1.0"
description = "Typed OS credential-store companion for the Appliance CLI"
authors = ["Eliot Lim"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[dependencies]
appliance-credential-store = { path = "../credential-store", default-features = false, features = ["keyring"] }
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
dirs = "5"
fs2 = "0.4.3"
getrandom = "0.3"
libc = "0.2"
openidconnect = { version = "=4.0.1", features = ["reqwest-blocking"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
webbrowser = "1"
zeroize = "1"

[dev-dependencies]
ed25519-dalek = "2"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }

[[bin]]
name = "appliance-credhelper"
path = "src/main.rs"
