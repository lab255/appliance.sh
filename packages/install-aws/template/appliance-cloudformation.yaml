AWSTemplateFormatVersion: '2010-09-09'
Description: Appliance system substrate and Lambda control plane

Parameters:
  InstallationName:
    Type: String
    AllowedPattern: '^[a-z][a-z0-9-]{2,31}$'
    Description: Stable lowercase name used to identify this Appliance installation
  ImageUri:
    Type: String
    Default: ''
    Description: Digest-pinned image URI in ImageRepository; empty creates only the substrate
  ImageArchitecture:
    Type: String
    Default: x86_64
    AllowedValues: [x86_64, arm64]
  SystemRoleMode:
    Type: String
    Default: scoped
    AllowedValues: [scoped, admin]
    Description: Scoped least-privilege system roles by default; admin is an operator break-glass escape hatch

Conditions:
  HasImage: !Not [!Equals [!Ref ImageUri, '']]
  UseAdminSystemRoles: !Equals [!Ref SystemRoleMode, admin]
  UseScopedSystemRoles: !Equals [!Ref SystemRoleMode, scoped]

Resources:
  StateBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      BucketOwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      Tags:
        - Key: appliance.sh/installation
          Value: !Ref InstallationName

  DataBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      BucketOwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      Tags:
        - Key: appliance.sh/installation
          Value: !Ref InstallationName

  StateKmsKey:
    Type: AWS::KMS::Key
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: !Sub Appliance ${InstallationName} Pulumi secrets key
      EnableKeyRotation: true
      PendingWindowInDays: 7
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: EnableRootAndIamPermissions
            Effect: Allow
            Principal:
              AWS: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:root
            Action: kms:*
            Resource: '*'

  StateKmsAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub alias/appliance-${InstallationName}
      TargetKeyId: !Ref StateKmsKey

  UserAppliancePermissionsBoundary:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: Maximum permissions for worker-created user appliance Lambda roles
      ManagedPolicyName: !Sub ${InstallationName}-user-appliance-boundary
      Path: /appliance/
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowUserApplianceRuntimePermissions
            Effect: Allow
            Action: '*'
            Resource: '*'
          - Sid: DenyIamEscalation
            Effect: Deny
            Action: iam:*
            Resource: '*'
          - Sid: DenyControlPlaneStackMutation
            Effect: Deny
            Action: cloudformation:UpdateStack
            Resource: !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${AWS::StackName}/*
          - Sid: DenySystemFunctionMutation
            Effect: Deny
            Action:
              - lambda:AddPermission
              - lambda:CreateAlias
              - lambda:CreateFunctionUrlConfig
              - lambda:DeleteAlias
              - lambda:DeleteFunction
              - lambda:DeleteFunctionCodeSigningConfig
              - lambda:DeleteFunctionConcurrency
              - lambda:DeleteFunctionEventInvokeConfig
              - lambda:DeleteFunctionUrlConfig
              - lambda:DeleteProvisionedConcurrencyConfig
              - lambda:PublishVersion
              - lambda:PutFunctionCodeSigningConfig
              - lambda:PutFunctionConcurrency
              - lambda:PutFunctionEventInvokeConfig
              - lambda:PutFunctionRecursionConfig
              - lambda:PutFunctionScalingConfig
              - lambda:PutProvisionedConcurrencyConfig
              - lambda:PutRuntimeManagementConfig
              - lambda:RemovePermission
              - lambda:TagResource
              - lambda:UntagResource
              - lambda:UpdateAlias
              - lambda:UpdateFunctionCode
              - lambda:UpdateFunctionConfiguration
              - lambda:UpdateFunctionEventInvokeConfig
              - lambda:UpdateFunctionUrlConfig
            Resource:
              - !Sub arn:${AWS::Partition}:lambda:*:${AWS::AccountId}:function:${InstallationName}-api-server
              - !Sub arn:${AWS::Partition}:lambda:*:${AWS::AccountId}:function:${InstallationName}-worker

  SystemApiServerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - !If
          - UseAdminSystemRoles
          - !Sub arn:${AWS::Partition}:iam::aws:policy/AdministratorAccess
          - !Ref AWS::NoValue
      Policies:
        - !If
          - UseScopedSystemRoles
          - PolicyName: appliance-system-api-server
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Sid: DataBucketMetadata
                  Effect: Allow
                  Action:
                    - s3:GetBucketLocation
                    - s3:ListBucket
                  Resource: !GetAtt DataBucket.Arn
                - Sid: DataBucketObjects
                  Effect: Allow
                  Action:
                    - s3:DeleteObject
                    - s3:GetObject
                    - s3:PutObject
                  Resource: !Sub ${DataBucket.Arn}/*
          - !Ref AWS::NoValue
      Tags:
        - Key: appliance.sh/installation
          Value: !Ref InstallationName

  SystemWorkerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - !If
          - UseAdminSystemRoles
          - !Sub arn:${AWS::Partition}:iam::aws:policy/AdministratorAccess
          - !Ref AWS::NoValue
      # CU1 marker: add sts:AssumeRole on SelfUpdateRole here only after that role exists.
      # CU1 marker: a stack policy Deny Update:* on both system roles becomes load-bearing with the CFN service role.
      Policies:
        - !If
          - UseScopedSystemRoles
          - PolicyName: appliance-system-worker
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Sid: DataBucketMetadata
                  Effect: Allow
                  Action:
                    - s3:GetBucketLocation
                    - s3:ListBucket
                  Resource: !GetAtt DataBucket.Arn
                - Sid: DataBucketObjects
                  Effect: Allow
                  Action:
                    - s3:DeleteObject
                    - s3:GetObject
                    - s3:PutObject
                  Resource: !Sub ${DataBucket.Arn}/*
                - Sid: PulumiStateBucketMetadata
                  Effect: Allow
                  Action:
                    - s3:GetBucketLocation
                    - s3:ListBucket
                  Resource: !GetAtt StateBucket.Arn
                - Sid: PulumiStateObjects
                  Effect: Allow
                  Action:
                    - s3:DeleteObject
                    - s3:GetObject
                    - s3:PutObject
                  Resource: !Sub ${StateBucket.Arn}/*
                - Sid: PulumiSecretsKey
                  Effect: Allow
                  Action:
                    - kms:Decrypt
                    - kms:DescribeKey
                    - kms:Encrypt
                    - kms:GenerateDataKey
                  Resource: !GetAtt StateKmsKey.Arn
                # ECR authorization tokens are account-scoped and do not support repository ARNs.
                - Sid: EcrAuthorization
                  Effect: Allow
                  Action: ecr:GetAuthorizationToken
                  Resource: '*'
                - Sid: InstallationRepository
                  Effect: Allow
                  Action:
                    - ecr:BatchCheckLayerAvailability
                    - ecr:BatchGetImage
                    - ecr:CompleteLayerUpload
                    - ecr:DescribeImages
                    - ecr:GetDownloadUrlForLayer
                    - ecr:GetRepositoryPolicy
                    - ecr:InitiateLayerUpload
                    - ecr:ListImages
                    - ecr:PutImage
                    - ecr:UploadLayerPart
                  Resource: !GetAtt ImageRepository.Arn
                # CU1 marker: split a worker-read-only SystemImageRepository from the BuildImageRepository before self-update mirrors land.
                # STS identity discovery has no resource-level permission model.
                - Sid: AccountIdentity
                  Effect: Allow
                  Action: sts:GetCallerIdentity
                  Resource: '*'
                # aws-native Permission resources use Cloud Control, whose API is account-scoped.
                # Cloud Control exposes no service-specific condition key, so TypeName cannot be restricted here.
                - Sid: AwsNativeCloudControl
                  Effect: Allow
                  Action:
                    - cloudformation:CreateResource
                    - cloudformation:DeleteResource
                    - cloudformation:GetResource
                    - cloudformation:GetResourceRequestStatus
                    - cloudformation:UpdateResource
                  Resource: '*'
                - Sid: ApplianceIamRoleRead
                  Effect: Allow
                  Action:
                    - iam:GetRole
                    - iam:GetRolePolicy
                    - iam:ListAttachedRolePolicies
                    - iam:ListInstanceProfilesForRole
                    - iam:ListRolePolicies
                  Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/appliance/*
                - Sid: ApplianceIamRoleBoundaryMutations
                  Effect: Allow
                  Action:
                    - iam:CreateRole
                    - iam:DeleteRolePolicy
                    - iam:PutRolePolicy
                  Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/appliance/*
                  Condition:
                    ArnEquals:
                      iam:PermissionsBoundary: !Ref UserAppliancePermissionsBoundary
                - Sid: ApplianceIamRolePolicyAttachments
                  Effect: Allow
                  Action:
                    - iam:AttachRolePolicy
                    - iam:DetachRolePolicy
                  Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/appliance/*
                  Condition:
                    ArnEquals:
                      iam:PermissionsBoundary: !Ref UserAppliancePermissionsBoundary
                      iam:PolicyARN:
                        - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/appliance/*
                        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
                - Sid: ApplianceIamRoleMetadataMutations
                  Effect: Allow
                  Action:
                    - iam:DeleteRole
                    - iam:UntagRole
                    - iam:UpdateAssumeRolePolicy
                  Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/appliance/*
                  Condition:
                    StringEquals:
                      aws:ResourceTag/appliance:managed: 'true'
                - Sid: ApplianceIamRoleTagging
                  Effect: Allow
                  Action: iam:TagRole
                  Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/appliance/*
                  Condition:
                    ArnEquals:
                      iam:PermissionsBoundary: !Ref UserAppliancePermissionsBoundary
                    StringEquals:
                      aws:RequestTag/appliance:managed: 'true'
                - Sid: ApplianceIamPassRole
                  Effect: Allow
                  Action:
                    - iam:PassRole
                  Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/appliance/*
                  Condition:
                    ArnEquals:
                      iam:PermissionsBoundary: !Ref UserAppliancePermissionsBoundary
                    StringEquals:
                      iam:PassedToService:
                        - lambda.amazonaws.com
                        - edgelambda.amazonaws.com
                - Sid: DenyPermissionsBoundaryRemoval
                  Effect: Deny
                  Action:
                    - iam:DeleteRolePermissionsBoundary
                    - iam:PutRolePermissionsBoundary
                  Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/appliance/*
                - Sid: ApplianceIamPolicyRead
                  Effect: Allow
                  Action:
                    - iam:GetPolicy
                    - iam:GetPolicyVersion
                    - iam:ListPolicyTags
                    - iam:ListPolicyVersions
                  Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/appliance/*
                - Sid: ApplianceIamPolicyCreate
                  Effect: Allow
                  Action: iam:CreatePolicy
                  Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/appliance/*
                  Condition:
                    StringEquals:
                      aws:RequestTag/appliance:managed: 'true'
                - Sid: ApplianceIamPolicyMutations
                  Effect: Allow
                  Action:
                    - iam:CreatePolicyVersion
                    - iam:DeletePolicy
                    - iam:DeletePolicyVersion
                    - iam:SetDefaultPolicyVersion
                    - iam:UntagPolicy
                  Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/appliance/*
                  Condition:
                    StringEquals:
                      aws:ResourceTag/appliance:managed: 'true'
                - Sid: ApplianceIamPolicyTagging
                  Effect: Allow
                  Action: iam:TagPolicy
                  Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/appliance/*
                  Condition:
                    StringEquals:
                      aws:RequestTag/appliance:managed: 'true'
                - Sid: LambdaEdgeServiceLinkedRoles
                  Effect: Allow
                  Action: iam:CreateServiceLinkedRole
                  Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/aws-service-role/*
                  Condition:
                    StringEquals:
                      iam:AWSServiceName:
                        - replicator.lambda.amazonaws.com
                        - logger.cloudfront.amazonaws.com
                - Sid: ApplianceFunctions
                  Effect: Allow
                  Action:
                    - lambda:AddPermission
                    - lambda:CreateFunction
                    - lambda:CreateFunctionUrlConfig
                    - lambda:DeleteFunction
                    - lambda:DeleteFunctionUrlConfig
                    - lambda:GetFunction
                    - lambda:GetFunctionCodeSigningConfig
                    - lambda:GetFunctionConfiguration
                    - lambda:GetFunctionUrlConfig
                    - lambda:GetPolicy
                    - lambda:ListTags
                    - lambda:ListVersionsByFunction
                    - lambda:PublishVersion
                    - lambda:RemovePermission
                    - lambda:TagResource
                    - lambda:UntagResource
                    - lambda:UpdateFunctionCode
                    - lambda:UpdateFunctionConfiguration
                    - lambda:UpdateFunctionUrlConfig
                  Resource: !Sub arn:${AWS::Partition}:lambda:*:${AWS::AccountId}:function:*
                - Sid: ApplianceLayers
                  Effect: Allow
                  Action: lambda:GetLayerVersion
                  Resource: !Sub arn:${AWS::Partition}:lambda:*:${AWS::AccountId}:layer:*:*
                - Sid: DenySystemFunctionMutation
                  Effect: Deny
                  Action:
                    - lambda:AddPermission
                    - lambda:CreateFunction
                    - lambda:CreateFunctionUrlConfig
                    - lambda:DeleteFunction
                    - lambda:DeleteFunctionUrlConfig
                    - lambda:PublishVersion
                    - lambda:RemovePermission
                    - lambda:TagResource
                    - lambda:UntagResource
                    - lambda:UpdateFunctionCode
                    - lambda:UpdateFunctionConfiguration
                    - lambda:UpdateFunctionUrlConfig
                  Resource:
                    - !Sub arn:${AWS::Partition}:lambda:*:${AWS::AccountId}:function:${InstallationName}-api-server
                    - !Sub arn:${AWS::Partition}:lambda:*:${AWS::AccountId}:function:${InstallationName}-worker
                - Sid: LambdaEdgeReplication
                  Effect: Allow
                  Action:
                    - lambda:DisableReplication*
                    - lambda:EnableReplication*
                  Resource: !Sub arn:${AWS::Partition}:lambda:us-east-1:${AWS::AccountId}:function:*:*
                # CloudFront create/list operations and managed-policy discovery do not support resource ARNs.
                - Sid: CloudFrontAccountOperations
                  Effect: Allow
                  Action:
                    - cloudfront:CreateDistribution
                    - cloudfront:CreateDistributionWithTags
                    - cloudfront:CreateOriginAccessControl
                    - cloudfront:ListCachePolicies
                    - cloudfront:ListOriginAccessControls
                    - cloudfront:ListOriginRequestPolicies
                  Resource: '*'
                - Sid: ApplianceCloudFrontResources
                  Effect: Allow
                  Action:
                    - cloudfront:DeleteDistribution
                    - cloudfront:DeleteOriginAccessControl
                    - cloudfront:GetDistribution
                    - cloudfront:GetDistributionConfig
                    - cloudfront:GetOriginAccessControl
                    - cloudfront:GetOriginAccessControlConfig
                    - cloudfront:ListTagsForResource
                    - cloudfront:TagResource
                    - cloudfront:UntagResource
                    - cloudfront:UpdateDistribution
                    - cloudfront:UpdateOriginAccessControl
                  Resource:
                    - !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/*
                    - !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:origin-access-control/*
                - Sid: AwsManagedCloudFrontPolicies
                  Effect: Allow
                  Action:
                    - cloudfront:GetCachePolicy
                    - cloudfront:GetOriginRequestPolicy
                  Resource:
                    - !Sub arn:${AWS::Partition}:cloudfront::aws:cache-policy/*
                    - !Sub arn:${AWS::Partition}:cloudfront::aws:origin-request-policy/*
                # Hosted-zone creation has no resource ARN because the zone does not exist yet.
                - Sid: Route53CreateHostedZone
                  Effect: Allow
                  Action: route53:CreateHostedZone
                  Resource: '*'
                - Sid: ApplianceHostedZones
                  Effect: Allow
                  Action:
                    - route53:ChangeResourceRecordSets
                    - route53:ChangeTagsForResource
                    - route53:DeleteHostedZone
                    - route53:GetHostedZone
                    - route53:ListResourceRecordSets
                    - route53:ListTagsForResource
                  Resource: !Sub arn:${AWS::Partition}:route53:::hostedzone/*
                - Sid: Route53Changes
                  Effect: Allow
                  Action: route53:GetChange
                  Resource: !Sub arn:${AWS::Partition}:route53:::change/*
                # ACM certificate creation has no resource ARN before RequestCertificate returns one.
                - Sid: AcmRequestCertificate
                  Effect: Allow
                  Action: acm:RequestCertificate
                  Resource: '*'
                - Sid: ApplianceCertificates
                  Effect: Allow
                  Action:
                    - acm:AddTagsToCertificate
                    - acm:DeleteCertificate
                    - acm:DescribeCertificate
                    - acm:ListTagsForCertificate
                    - acm:RemoveTagsFromCertificate
                  Resource: !Sub arn:${AWS::Partition}:acm:*:${AWS::AccountId}:certificate/*
                - Sid: ApplianceLogGroups
                  Effect: Allow
                  Action:
                    - logs:CreateLogGroup
                    - logs:DeleteLogGroup
                    - logs:DeleteRetentionPolicy
                    - logs:ListTagsForResource
                    - logs:PutRetentionPolicy
                    - logs:TagResource
                    - logs:UntagResource
                  Resource: !Sub arn:${AWS::Partition}:logs:*:${AWS::AccountId}:log-group:/appliance/*
                # Logs describe APIs enumerate regional account state and do not support resource ARNs.
                - Sid: LogsAccountDiscovery
                  Effect: Allow
                  Action:
                    - logs:DescribeDeliveries
                    - logs:DescribeDeliveryDestinations
                    - logs:DescribeDeliverySources
                    - logs:DescribeLogGroups
                  Resource: '*'
                - Sid: ApplianceLogDeliveryResources
                  Effect: Allow
                  Action:
                    - logs:CreateDelivery
                    - logs:DeleteDelivery
                    - logs:DeleteDeliveryDestination
                    - logs:DeleteDeliverySource
                    - logs:GetDelivery
                    - logs:GetDeliveryDestination
                    - logs:GetDeliverySource
                    - logs:ListTagsForResource
                    - logs:PutDeliveryDestination
                    - logs:PutDeliverySource
                    - logs:TagResource
                    - logs:UntagResource
                    - logs:UpdateDeliveryConfiguration
                  Resource:
                    - !Sub arn:${AWS::Partition}:logs:*:${AWS::AccountId}:delivery:*
                    - !Sub arn:${AWS::Partition}:logs:*:${AWS::AccountId}:delivery-destination:*
                    - !Sub arn:${AWS::Partition}:logs:*:${AWS::AccountId}:delivery-source:*
          - !Ref AWS::NoValue
      Tags:
        - Key: appliance.sh/installation
          Value: !Ref InstallationName

  ImageRepository:
    Type: AWS::ECR::Repository
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      ImageScanningConfiguration:
        ScanOnPush: true
      EncryptionConfiguration:
        EncryptionType: AES256
      LifecyclePolicy:
        LifecyclePolicyText: |
          {"rules":[{"rulePriority":1,"description":"Keep the newest 50 images","selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":50},"action":{"type":"expire"}}]}
      Tags:
        - Key: appliance.sh/installation
          Value: !Ref InstallationName

  BootstrapTokenSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: !Sub One-time bootstrap credential for Appliance ${InstallationName}
      GenerateSecretString:
        ExcludePunctuation: true
        GenerateStringKey: token
        PasswordLength: 43
        SecretStringTemplate: '{}'
      Tags:
        - Key: appliance.sh/installation
          Value: !Ref InstallationName

  WorkerLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: HasImage
    Properties:
      LogGroupName: !Sub /aws/lambda/${InstallationName}-worker
      RetentionInDays: 30

  WorkerFunction:
    Type: AWS::Lambda::Function
    Condition: HasImage
    DependsOn: WorkerLogGroup
    Properties:
      FunctionName: !Sub ${InstallationName}-worker
      PackageType: Image
      Code:
        ImageUri: !Ref ImageUri
      Role: !GetAtt SystemWorkerRole.Arn
      Architectures: [!Ref ImageArchitecture]
      Timeout: 900
      MemorySize: 2048
      EphemeralStorage:
        Size: 4096
      Environment:
        Variables:
          APPLIANCE_MODE: worker
          APPLIANCE_DATA_BUCKET: !Ref DataBucket
          APPLIANCE_BASE_CONFIG_KEY: system/base-config.json
          PULUMI_BACKEND_URL: !Sub s3://${StateBucket}
          PULUMI_CONFIG_PASSPHRASE: ''
          APPLIANCE_TRUST_PROXY: 'true'

  WorkerFunctionUrl:
    Type: AWS::Lambda::Url
    Condition: HasImage
    Properties:
      TargetFunctionArn: !GetAtt WorkerFunction.Arn
      AuthType: NONE
      InvokeMode: BUFFERED

  WorkerFunctionUrlPermission:
    Type: AWS::Lambda::Permission
    Condition: HasImage
    Properties:
      Action: lambda:InvokeFunctionUrl
      FunctionName: !Ref WorkerFunction
      FunctionUrlAuthType: NONE
      Principal: '*'

  ApiServerLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: HasImage
    Properties:
      LogGroupName: !Sub /aws/lambda/${InstallationName}-api-server
      RetentionInDays: 30

  ApiServerFunction:
    Type: AWS::Lambda::Function
    Condition: HasImage
    DependsOn: ApiServerLogGroup
    Properties:
      FunctionName: !Sub ${InstallationName}-api-server
      PackageType: Image
      Code:
        ImageUri: !Ref ImageUri
      Role: !GetAtt SystemApiServerRole.Arn
      Architectures: [!Ref ImageArchitecture]
      Timeout: 30
      MemorySize: 2048
      EphemeralStorage:
        Size: 4096
      Environment:
        Variables:
          APPLIANCE_MODE: server
          APPLIANCE_DATA_BUCKET: !Ref DataBucket
          APPLIANCE_BASE_CONFIG_KEY: system/base-config.json
          PULUMI_BACKEND_URL: !Sub s3://${StateBucket}
          PULUMI_CONFIG_PASSPHRASE: ''
          APPLIANCE_TRUST_PROXY: 'true'
          WORKER_URL: !GetAtt WorkerFunctionUrl.FunctionUrl
          BOOTSTRAP_TOKEN: !Sub '{{resolve:secretsmanager:${BootstrapTokenSecret}:SecretString:token}}'

  ApiServerFunctionUrl:
    Type: AWS::Lambda::Url
    Condition: HasImage
    Properties:
      TargetFunctionArn: !GetAtt ApiServerFunction.Arn
      AuthType: NONE
      InvokeMode: BUFFERED

  ApiServerFunctionUrlPermission:
    Type: AWS::Lambda::Permission
    Condition: HasImage
    Properties:
      Action: lambda:InvokeFunctionUrl
      FunctionName: !Ref ApiServerFunction
      FunctionUrlAuthType: NONE
      Principal: '*'

Outputs:
  StateBucketName:
    Value: !Ref StateBucket
  StateBucketArn:
    Value: !GetAtt StateBucket.Arn
  DataBucketName:
    Value: !Ref DataBucket
  DataBucketArn:
    Value: !GetAtt DataBucket.Arn
  StateKmsKeyArn:
    Value: !GetAtt StateKmsKey.Arn
  StateKmsAliasName:
    Value: !Ref StateKmsAlias
  ImageRepositoryUrl:
    Value: !GetAtt ImageRepository.RepositoryUri
  SystemApiServerRoleArn:
    Value: !GetAtt SystemApiServerRole.Arn
  SystemWorkerRoleArn:
    Value: !GetAtt SystemWorkerRole.Arn
  UserAppliancePermissionsBoundaryArn:
    Value: !Ref UserAppliancePermissionsBoundary
  BootstrapTokenSecretArn:
    Value: !Ref BootstrapTokenSecret
  WorkerFunctionName:
    Condition: HasImage
    Value: !Ref WorkerFunction
  WorkerFunctionArn:
    Condition: HasImage
    Value: !GetAtt WorkerFunction.Arn
  WorkerFunctionUrl:
    Condition: HasImage
    Value: !GetAtt WorkerFunctionUrl.FunctionUrl
  ApiServerFunctionName:
    Condition: HasImage
    Value: !Ref ApiServerFunction
  ApiServerFunctionArn:
    Condition: HasImage
    Value: !GetAtt ApiServerFunction.Arn
  ApiServerFunctionUrl:
    Condition: HasImage
    Value: !GetAtt ApiServerFunctionUrl.FunctionUrl
