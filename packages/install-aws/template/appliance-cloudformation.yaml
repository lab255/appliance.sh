AWSTemplateFormatVersion: '2010-09-09'
Description: Appliance system substrate and Lambda control plane

Parameters:
  InstallationName:
    Type: String
    AllowedPattern: '^[a-z][a-z0-9-]{2,31}$'
    Description: Stable lowercase name used to identify this Appliance installation
  ImageUri:
    Type: String
    Default: ''
    Description: Digest-pinned image URI in ImageRepository; empty creates only the substrate
  ImageArchitecture:
    Type: String
    Default: x86_64
    AllowedValues: [x86_64, arm64]
  SystemRoleMode:
    Type: String
    Default: scoped
    AllowedValues: [scoped, admin]
    Description: Scoped least-privilege system roles by default; admin is an operator break-glass escape hatch
  SelfUpdatePolicy:
    Type: String
    Default: off
    AllowedValues: [off, notify, auto]
    Description: Opt-in scheduled signed image update checks; baseline updates always remain operator-driven

Conditions:
  HasImage: !Not [!Equals [!Ref ImageUri, '']]
  UseAdminSystemRoles: !Equals [!Ref SystemRoleMode, admin]
  UseScopedSystemRoles: !Equals [!Ref SystemRoleMode, scoped]
  SelfUpdateScheduled: !And [!Condition HasImage, !Not [!Equals [!Ref SelfUpdatePolicy, off]]]

Resources:
  StateBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      BucketOwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      Tags:
        - Key: appliance.sh/installation
          Value: !Ref InstallationName

  DataBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      BucketOwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      Tags:
        - Key: appliance.sh/installation
          Value: !Ref InstallationName

  StateKmsKey:
    Type: AWS::KMS::Key
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: !Sub Appliance ${InstallationName} Pulumi secrets key
      EnableKeyRotation: true
      PendingWindowInDays: 7
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: EnableRootAndIamPermissions
            Effect: Allow
            Principal:
              AWS: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:root
            Action: kms:*
            Resource: '*'

  StateKmsAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub alias/appliance-${InstallationName}
      TargetKeyId: !Ref StateKmsKey

  UserAppliancePermissionsBoundary:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: Maximum permissions for worker-created user appliance Lambda roles
      ManagedPolicyName: !Sub ${InstallationName}-user-appliance-boundary
      Path: /appliance-system/
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowUserApplianceRuntimePermissions
            Effect: Allow
            Action: '*'
            Resource: '*'
          - Sid: DenyIamEscalation
            Effect: Deny
            Action: iam:*
            Resource: '*'
          - Sid: DenyControlPlaneStackMutation
            Effect: Deny
            NotAction:
              - cloudformation:Describe*
              - cloudformation:Get*
              - cloudformation:List*
              - cloudformation:Detect*
              - cloudformation:Validate*
            Resource: !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${AWS::StackName}/*
          - Sid: DenyBoundaryPolicyMutation
            Effect: Deny
            Action:
              - iam:CreatePolicyVersion
              - iam:DeletePolicy
              - iam:DeletePolicyVersion
              - iam:SetDefaultPolicyVersion
              - iam:TagPolicy
              - iam:UntagPolicy
            # Spell out the ARN to avoid a CloudFormation self-reference cycle.
            Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/appliance-system/${InstallationName}-user-appliance-boundary
          - Sid: DenyAssumeOutsideApplianceRoles
            Effect: Deny
            Action: sts:AssumeRole
            NotResource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/appliance/*
          - Sid: DenySystemFunctionMutation
            Effect: Deny
            Action:
              - lambda:AddPermission
              - lambda:CreateAlias
              - lambda:CreateFunctionUrlConfig
              - lambda:DeleteAlias
              - lambda:DeleteFunction
              - lambda:DeleteFunctionCodeSigningConfig
              - lambda:DeleteFunctionConcurrency
              - lambda:DeleteFunctionEventInvokeConfig
              - lambda:DeleteFunctionUrlConfig
              - lambda:DeleteProvisionedConcurrencyConfig
              - lambda:PublishVersion
              - lambda:PutFunctionCodeSigningConfig
              - lambda:PutFunctionConcurrency
              - lambda:PutFunctionEventInvokeConfig
              - lambda:PutFunctionRecursionConfig
              - lambda:PutFunctionScalingConfig
              - lambda:PutProvisionedConcurrencyConfig
              - lambda:PutRuntimeManagementConfig
              - lambda:RemovePermission
              - lambda:TagResource
              - lambda:UntagResource
              - lambda:UpdateAlias
              - lambda:UpdateFunctionCode
              - lambda:UpdateFunctionConfiguration
              - lambda:UpdateFunctionEventInvokeConfig
              - lambda:UpdateFunctionUrlConfig
            Resource:
              - !Sub arn:${AWS::Partition}:lambda:*:${AWS::AccountId}:function:${InstallationName}-api-server
              - !Sub arn:${AWS::Partition}:lambda:*:${AWS::AccountId}:function:${InstallationName}-api-server:*
              - !Sub arn:${AWS::Partition}:lambda:*:${AWS::AccountId}:function:${InstallationName}-worker
              - !Sub arn:${AWS::Partition}:lambda:*:${AWS::AccountId}:function:${InstallationName}-worker:*
          - Sid: DenySchedulerMutation
            Effect: Deny
            Action:
              - scheduler:CreateSchedule*
              - scheduler:DeleteSchedule*
              - scheduler:UpdateSchedule*
            Resource: !Sub arn:${AWS::Partition}:scheduler:${AWS::Region}:${AWS::AccountId}:schedule/default/${InstallationName}-self-update

  SystemApiServerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - !If
          - UseAdminSystemRoles
          - !Sub arn:${AWS::Partition}:iam::aws:policy/AdministratorAccess
          - !Ref AWS::NoValue
      Policies:
        - !If
          - UseScopedSystemRoles
          - PolicyName: appliance-system-api-server
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Sid: DataBucketMetadata
                  Effect: Allow
                  Action:
                    - s3:GetBucketLocation
                    - s3:ListBucket
                  Resource: !GetAtt DataBucket.Arn
                - Sid: DataBucketObjects
                  Effect: Allow
                  Action:
                    - s3:DeleteObject
                    - s3:GetObject
                    - s3:PutObject
                  Resource: !Sub ${DataBucket.Arn}/*
          - !Ref AWS::NoValue
      Tags:
        - Key: appliance.sh/installation
          Value: !Ref InstallationName

  SystemWorkerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - !If
          - UseScopedSystemRoles
          - !Ref SystemWorkerProvisioningPolicy
          - !Ref AWS::NoValue
        - !If
          - UseScopedSystemRoles
          - !Ref SystemWorkerEdgeProvisioningPolicy
          - !Ref AWS::NoValue
        - !If
          - UseAdminSystemRoles
          - !Sub arn:${AWS::Partition}:iam::aws:policy/AdministratorAccess
          - !Ref AWS::NoValue
      Policies:
        - !If
          - UseScopedSystemRoles
          - PolicyName: appliance-system-worker-runtime
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Sid: DataBucketMetadata
                  Effect: Allow
                  Action:
                    - s3:GetBucketLocation
                    - s3:ListBucket
                  Resource: !GetAtt DataBucket.Arn
                - Sid: DataBucketObjects
                  Effect: Allow
                  Action:
                    - s3:DeleteObject
                    - s3:GetObject
                    - s3:PutObject
                  Resource: !Sub ${DataBucket.Arn}/*
                - Sid: PulumiStateBucketMetadata
                  Effect: Allow
                  Action:
                    - s3:GetBucketLocation
                    - s3:ListBucket
                  Resource: !GetAtt StateBucket.Arn
                - Sid: PulumiStateObjects
                  Effect: Allow
                  Action:
                    - s3:DeleteObject
                    - s3:GetObject
                    - s3:PutObject
                  Resource: !Sub ${StateBucket.Arn}/*
                - Sid: PulumiSecretsKey
                  Effect: Allow
                  Action:
                    - kms:Decrypt
                    - kms:DescribeKey
                    - kms:Encrypt
                    - kms:GenerateDataKey
                  Resource: !GetAtt StateKmsKey.Arn
                # ECR authorization tokens are account-scoped and do not support repository ARNs.
                - Sid: EcrAuthorization
                  Effect: Allow
                  Action: ecr:GetAuthorizationToken
                  Resource: '*'
                - Sid: InstallationRepository
                  Effect: Allow
                  Action:
                    - ecr:BatchCheckLayerAvailability
                    - ecr:BatchGetImage
                    - ecr:CompleteLayerUpload
                    - ecr:DescribeImages
                    - ecr:GetDownloadUrlForLayer
                    - ecr:GetRepositoryPolicy
                    - ecr:InitiateLayerUpload
                    - ecr:ListImages
                    - ecr:PutImage
                    - ecr:UploadLayerPart
                  Resource: !GetAtt ImageRepository.Arn
                # CU1 marker: split a worker-read-only SystemImageRepository from the BuildImageRepository before self-update mirrors land.
                # STS identity discovery has no resource-level permission model.
                - Sid: AccountIdentity
                  Effect: Allow
                  Action: sts:GetCallerIdentity
                  Resource: '*'
                # aws-native Permission resources use Cloud Control, whose API is account-scoped.
                # Cloud Control exposes no service-specific condition key, so TypeName cannot be restricted here.
                - Sid: AwsNativeCloudControl
                  Effect: Allow
                  Action:
                    - cloudformation:CreateResource
                    - cloudformation:DeleteResource
                    - cloudformation:GetResource
                    - cloudformation:GetResourceRequestStatus
                    - cloudformation:UpdateResource
                  Resource: '*'
                - Sid: AssumeOnlySelfUpdateRole
                  Effect: Allow
                  Action: sts:AssumeRole
                  # Spelled out to avoid a WorkerRole <-> SelfUpdateRole dependency cycle.
                  Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/appliance-system/${InstallationName}-self-update
          - !Ref AWS::NoValue
      Tags:
        - Key: appliance.sh/installation
          Value: !Ref InstallationName

  SystemWorkerProvisioningPolicy:
    Type: AWS::IAM::ManagedPolicy
    Condition: UseScopedSystemRoles
    Properties:
      Description: Scoped user-appliance provisioning permissions for the system worker
      ManagedPolicyName: !Sub ${InstallationName}-system-worker-provisioning
      Path: /appliance-system/
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: ApplianceIamRoleRead
            Effect: Allow
            Action:
              - iam:GetRole
              - iam:GetRolePolicy
              - iam:ListAttachedRolePolicies
              - iam:ListInstanceProfilesForRole
              - iam:ListRolePolicies
              - iam:ListRoleTags
            Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/appliance/*
          - Sid: ApplianceIamRoleBoundaryMutations
            Effect: Allow
            Action:
              - iam:CreateRole
              - iam:DeleteRolePolicy
              - iam:PutRolePolicy
            Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/appliance/*
            Condition:
              ArnEquals:
                iam:PermissionsBoundary: !Ref UserAppliancePermissionsBoundary
          - Sid: ApplianceIamRolePolicyAttachments
            Effect: Allow
            Action:
              - iam:AttachRolePolicy
              - iam:DetachRolePolicy
            Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/appliance/*
            Condition:
              ArnEquals:
                iam:PermissionsBoundary: !Ref UserAppliancePermissionsBoundary
                iam:PolicyARN:
                  - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/appliance/*
                  - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
          - Sid: ApplianceIamRoleMetadataMutations
            Effect: Allow
            Action:
              - iam:DeleteRole
              - iam:UntagRole
            Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/appliance/*
            Condition:
              StringEquals:
                aws:ResourceTag/appliance:managed: 'true'
          - Sid: ApplianceIamRoleTagging
            Effect: Allow
            Action: iam:TagRole
            Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/appliance/*
            Condition:
              StringEquals:
                aws:RequestTag/appliance:managed: 'true'
          - Sid: ApplianceIamPassRole
            Effect: Allow
            Action:
              - iam:PassRole
            Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/appliance/*
            Condition:
              StringEquals:
                iam:PassedToService: lambda.amazonaws.com
          - Sid: AllowPermissionsBoundaryAdoption
            Effect: Allow
            Action: iam:PutRolePermissionsBoundary
            Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/appliance/*
            Condition:
              ArnEquals:
                iam:PermissionsBoundary: !Ref UserAppliancePermissionsBoundary
          - Sid: DenyPermissionsBoundaryRemoval
            Effect: Deny
            Action: iam:DeleteRolePermissionsBoundary
            Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/appliance/*
          - Sid: DenyBoundaryPolicyMutation
            Effect: Deny
            Action:
              - iam:CreatePolicyVersion
              - iam:DeletePolicy
              - iam:DeletePolicyVersion
              - iam:SetDefaultPolicyVersion
              - iam:TagPolicy
              - iam:UntagPolicy
            Resource: !Ref UserAppliancePermissionsBoundary
          - Sid: ApplianceIamPolicyRead
            Effect: Allow
            Action:
              - iam:GetPolicy
              - iam:GetPolicyVersion
              - iam:ListPolicyTags
              - iam:ListPolicyVersions
            Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/appliance/*
          - Sid: ApplianceIamPolicyCreate
            Effect: Allow
            Action: iam:CreatePolicy
            Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/appliance/*
            Condition:
              StringEquals:
                aws:RequestTag/appliance:managed: 'true'
          - Sid: ApplianceIamPolicyMutations
            Effect: Allow
            Action:
              - iam:CreatePolicyVersion
              - iam:DeletePolicy
              - iam:DeletePolicyVersion
              - iam:SetDefaultPolicyVersion
              - iam:UntagPolicy
            Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/appliance/*
            Condition:
              StringEquals:
                aws:ResourceTag/appliance:managed: 'true'
          - Sid: ApplianceIamPolicyTagging
            Effect: Allow
            Action: iam:TagPolicy
            Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/appliance/*
            Condition:
              StringEquals:
                aws:RequestTag/appliance:managed: 'true'
          - Sid: LambdaEdgeServiceLinkedRoles
            Effect: Allow
            Action: iam:CreateServiceLinkedRole
            Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/aws-service-role/*
            Condition:
              StringEquals:
                iam:AWSServiceName:
                  - replicator.lambda.amazonaws.com
                  - logger.cloudfront.amazonaws.com
          - Sid: ApplianceFunctions
            Effect: Allow
            Action:
              - lambda:AddPermission
              - lambda:CreateFunction
              - lambda:CreateFunctionUrlConfig
              - lambda:DeleteFunction
              - lambda:DeleteFunctionUrlConfig
              - lambda:GetFunction
              - lambda:GetFunctionCodeSigningConfig
              - lambda:GetFunctionConfiguration
              - lambda:GetFunctionUrlConfig
              - lambda:GetPolicy
              - lambda:ListTags
              - lambda:ListVersionsByFunction
              - lambda:PublishVersion
              - lambda:RemovePermission
              - lambda:TagResource
              - lambda:UntagResource
              - lambda:UpdateFunctionCode
              - lambda:UpdateFunctionConfiguration
              - lambda:UpdateFunctionUrlConfig
            Resource: !Sub arn:${AWS::Partition}:lambda:*:${AWS::AccountId}:function:*
          - Sid: ApplianceLayers
            Effect: Allow
            Action: lambda:GetLayerVersion
            Resource: !Sub arn:${AWS::Partition}:lambda:*:${AWS::AccountId}:layer:*:*
          - Sid: DenySystemFunctionMutation
            Effect: Deny
            Action:
              - lambda:AddPermission
              - lambda:CreateFunction
              - lambda:CreateFunctionUrlConfig
              - lambda:DeleteFunction
              - lambda:DeleteFunctionUrlConfig
              - lambda:PublishVersion
              - lambda:RemovePermission
              - lambda:TagResource
              - lambda:UntagResource
              - lambda:UpdateFunctionCode
              - lambda:UpdateFunctionConfiguration
              - lambda:UpdateFunctionUrlConfig
            Resource:
              - !Sub arn:${AWS::Partition}:lambda:*:${AWS::AccountId}:function:${InstallationName}-api-server
              - !Sub arn:${AWS::Partition}:lambda:*:${AWS::AccountId}:function:${InstallationName}-api-server:*
              - !Sub arn:${AWS::Partition}:lambda:*:${AWS::AccountId}:function:${InstallationName}-worker
              - !Sub arn:${AWS::Partition}:lambda:*:${AWS::AccountId}:function:${InstallationName}-worker:*
          - Sid: DenySchedulerMutation
            Effect: Deny
            Action:
              - scheduler:CreateSchedule*
              - scheduler:DeleteSchedule*
              - scheduler:UpdateSchedule*
            Resource: !Sub arn:${AWS::Partition}:scheduler:${AWS::Region}:${AWS::AccountId}:schedule/default/${InstallationName}-self-update

  SystemWorkerEdgeProvisioningPolicy:
    Type: AWS::IAM::ManagedPolicy
    Condition: UseScopedSystemRoles
    Properties:
      Description: Scoped edge-service provisioning permissions for the system worker
      ManagedPolicyName: !Sub ${InstallationName}-system-worker-edge-provisioning
      Path: /appliance-system/
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: LambdaEdgeReplication
            Effect: Allow
            Action:
              - lambda:DisableReplication*
              - lambda:EnableReplication*
            Resource: !Sub arn:${AWS::Partition}:lambda:us-east-1:${AWS::AccountId}:function:*:*
          # CloudFront create/list operations and managed-policy discovery do not support resource ARNs.
          - Sid: CloudFrontAccountOperations
            Effect: Allow
            Action:
              - cloudfront:CreateDistribution
              - cloudfront:CreateDistributionWithTags
              - cloudfront:CreateOriginAccessControl
              - cloudfront:ListCachePolicies
              - cloudfront:ListOriginAccessControls
              - cloudfront:ListOriginRequestPolicies
            Resource: '*'
          - Sid: ApplianceCloudFrontResources
            Effect: Allow
            Action:
              - cloudfront:DeleteDistribution
              - cloudfront:DeleteOriginAccessControl
              - cloudfront:GetDistribution
              - cloudfront:GetDistributionConfig
              - cloudfront:GetOriginAccessControl
              - cloudfront:GetOriginAccessControlConfig
              - cloudfront:ListTagsForResource
              - cloudfront:TagResource
              - cloudfront:UntagResource
              - cloudfront:UpdateDistribution
              - cloudfront:UpdateOriginAccessControl
            Resource:
              - !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/*
              - !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:origin-access-control/*
          - Sid: AwsManagedCloudFrontPolicies
            Effect: Allow
            Action:
              - cloudfront:GetCachePolicy
              - cloudfront:GetOriginRequestPolicy
            Resource:
              - !Sub arn:${AWS::Partition}:cloudfront::aws:cache-policy/*
              - !Sub arn:${AWS::Partition}:cloudfront::aws:origin-request-policy/*
          # Hosted-zone creation has no resource ARN because the zone does not exist yet.
          - Sid: Route53CreateHostedZone
            Effect: Allow
            Action: route53:CreateHostedZone
            Resource: '*'
          - Sid: ApplianceHostedZones
            Effect: Allow
            Action:
              - route53:ChangeResourceRecordSets
              - route53:ChangeTagsForResource
              - route53:DeleteHostedZone
              - route53:GetHostedZone
              - route53:ListResourceRecordSets
              - route53:ListTagsForResource
            Resource: !Sub arn:${AWS::Partition}:route53:::hostedzone/*
          - Sid: Route53Changes
            Effect: Allow
            Action: route53:GetChange
            Resource: !Sub arn:${AWS::Partition}:route53:::change/*
          # ACM certificate creation has no resource ARN before RequestCertificate returns one.
          - Sid: AcmRequestCertificate
            Effect: Allow
            Action: acm:RequestCertificate
            Resource: '*'
          - Sid: ApplianceCertificates
            Effect: Allow
            Action:
              - acm:AddTagsToCertificate
              - acm:DeleteCertificate
              - acm:DescribeCertificate
              - acm:ListTagsForCertificate
              - acm:RemoveTagsFromCertificate
            Resource: !Sub arn:${AWS::Partition}:acm:*:${AWS::AccountId}:certificate/*
          - Sid: ApplianceLogGroups
            Effect: Allow
            Action:
              - logs:CreateLogGroup
              - logs:DeleteLogGroup
              - logs:DeleteRetentionPolicy
              - logs:ListTagsForResource
              - logs:PutRetentionPolicy
              - logs:TagResource
              - logs:UntagResource
            Resource: !Sub arn:${AWS::Partition}:logs:*:${AWS::AccountId}:log-group:/appliance/*
          # Logs describe APIs enumerate regional account state and do not support resource ARNs.
          - Sid: LogsAccountDiscovery
            Effect: Allow
            Action:
              - logs:DescribeDeliveries
              - logs:DescribeDeliveryDestinations
              - logs:DescribeDeliverySources
              - logs:DescribeLogGroups
            Resource: '*'
          - Sid: ApplianceLogDeliveryResources
            Effect: Allow
            Action:
              - logs:CreateDelivery
              - logs:DeleteDelivery
              - logs:DeleteDeliveryDestination
              - logs:DeleteDeliverySource
              - logs:GetDelivery
              - logs:GetDeliveryDestination
              - logs:GetDeliverySource
              - logs:ListTagsForResource
              - logs:PutDeliveryDestination
              - logs:PutDeliverySource
              - logs:TagResource
              - logs:UntagResource
              - logs:UpdateDeliveryConfiguration
            Resource:
              - !Sub arn:${AWS::Partition}:logs:*:${AWS::AccountId}:delivery:*
              - !Sub arn:${AWS::Partition}:logs:*:${AWS::AccountId}:delivery-destination:*
              - !Sub arn:${AWS::Partition}:logs:*:${AWS::AccountId}:delivery-source:*

  SelfUpdateCloudFormationRole:
    Type: AWS::IAM::Role
    Condition: UseScopedSystemRoles
    Properties:
      RoleName: !Sub ${InstallationName}-self-update-cloudformation
      Path: /appliance-system/
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudformation.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: appliance-self-update-cloudformation
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: UpdateOnlySystemFunctionCode
                Effect: Allow
                Action:
                  - lambda:GetFunctionConfiguration
                  - lambda:ListTags
                  - lambda:TagResource
                  - lambda:UpdateFunctionCode
                Resource:
                  - !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${InstallationName}-api-server
                  - !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${InstallationName}-worker
      Tags:
        - Key: appliance.sh/installation
          Value: !Ref InstallationName

  SelfUpdateRole:
    Type: AWS::IAM::Role
    Condition: UseScopedSystemRoles
    Properties:
      RoleName: !Sub ${InstallationName}-self-update
      Path: /appliance-system/
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:root
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:PrincipalArn: !GetAtt SystemWorkerRole.Arn
              StringLike:
                sts:SourceIdentity: self-update-*
      Policies:
        - PolicyName: appliance-self-update
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: EcrAuth
                Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: '*'
              - Sid: MirrorOnlyToInstallationRepository
                Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:BatchGetImage
                  - ecr:CompleteLayerUpload
                  - ecr:DescribeImages
                  - ecr:GetDownloadUrlForLayer
                  - ecr:InitiateLayerUpload
                  - ecr:PutImage
                  - ecr:UploadLayerPart
                Resource: !GetAtt ImageRepository.Arn
              - Sid: ObserveOnlyThisStack
                Effect: Allow
                Action:
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                Resource: !Ref AWS::StackId
              - Sid: UpdateOnlyThisStack
                Effect: Allow
                Action:
                  - cloudformation:ContinueUpdateRollback
                  - cloudformation:UpdateStack
                Resource: !Ref AWS::StackId
                Condition:
                  StringEquals:
                    cloudformation:RoleArn: !GetAtt SelfUpdateCloudFormationRole.Arn
              - Sid: PassOnlySelfUpdateCloudFormationRole
                Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt SelfUpdateCloudFormationRole.Arn
                Condition:
                  StringEquals:
                    iam:PassedToService: cloudformation.amazonaws.com
      Tags:
        - Key: appliance.sh/installation
          Value: !Ref InstallationName

  SelfUpdateSchedulerRole:
    Type: AWS::IAM::Role
    Condition: SelfUpdateScheduled
    Properties:
      RoleName: !Sub ${InstallationName}-self-update-scheduler
      Path: /appliance-system/
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnLike:
                aws:SourceArn: !Sub arn:${AWS::Partition}:scheduler:${AWS::Region}:${AWS::AccountId}:schedule/default/${InstallationName}-self-update
      Policies:
        - PolicyName: appliance-self-update-scheduler
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: InvokeOnlySystemWorker
                Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt WorkerFunction.Arn
      Tags:
        - Key: appliance.sh/installation
          Value: !Ref InstallationName

  ImageRepository:
    Type: AWS::ECR::Repository
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration:
        ScanOnPush: true
      EncryptionConfiguration:
        EncryptionType: AES256
      # The 7-day untagged rule is safe only while every repository producer stays single-platform:
      # workload builds and both mirror paths push image manifests, never OCI indexes or attestations.
      # Source-digest provenance tags make immutable mirrors retryable; retain only the newest 10 so
      # superseded control-plane manifests remain bounded instead of being pinned forever.
      LifecyclePolicy:
        LifecyclePolicyText: |
          {"rules":[{"rulePriority":1,"description":"Keep the newest 50 workload build images","selection":{"tagStatus":"tagged","tagPrefixList":["build-"],"countType":"imageCountMoreThan","countNumber":50},"action":{"type":"expire"}},{"rulePriority":2,"description":"Keep the newest 10 source provenance images","selection":{"tagStatus":"tagged","tagPrefixList":["src-"],"countType":"imageCountMoreThan","countNumber":10},"action":{"type":"expire"}},{"rulePriority":3,"description":"Expire orphaned untagged manifests after 7 days","selection":{"tagStatus":"untagged","countType":"sinceImagePushed","countUnit":"days","countNumber":7},"action":{"type":"expire"}}]}
      Tags:
        - Key: appliance.sh/installation
          Value: !Ref InstallationName

  BootstrapTokenSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: !Sub One-time bootstrap credential for Appliance ${InstallationName}
      GenerateSecretString:
        ExcludePunctuation: true
        GenerateStringKey: token
        PasswordLength: 43
        SecretStringTemplate: '{}'
      Tags:
        - Key: appliance.sh/installation
          Value: !Ref InstallationName

  WorkerLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: HasImage
    Properties:
      LogGroupName: !Sub /aws/lambda/${InstallationName}-worker
      RetentionInDays: 30

  WorkerFunction:
    Type: AWS::Lambda::Function
    Condition: HasImage
    DependsOn: WorkerLogGroup
    Properties:
      FunctionName: !Sub ${InstallationName}-worker
      PackageType: Image
      Code:
        ImageUri: !Ref ImageUri
      Role: !GetAtt SystemWorkerRole.Arn
      Architectures: [!Ref ImageArchitecture]
      Timeout: 900
      MemorySize: 2048
      EphemeralStorage:
        Size: 4096
      Environment:
        Variables:
          APPLIANCE_MODE: worker
          APPLIANCE_DATA_BUCKET: !Ref DataBucket
          APPLIANCE_BASE_CONFIG_KEY: system/base-config.json
          APPLIANCE_STACK_ID: !Ref AWS::StackId
          SELF_UPDATE_ROLE_ARN: !If [UseScopedSystemRoles, !GetAtt SelfUpdateRole.Arn, '']
          SELF_UPDATE_POLICY: !Ref SelfUpdatePolicy
          PULUMI_BACKEND_URL: !Sub s3://${StateBucket}
          PULUMI_CONFIG_PASSPHRASE: ''
          APPLIANCE_TRUST_PROXY: 'true'

  WorkerFunctionUrl:
    Type: AWS::Lambda::Url
    Condition: HasImage
    Properties:
      TargetFunctionArn: !GetAtt WorkerFunction.Arn
      AuthType: NONE
      InvokeMode: BUFFERED

  WorkerFunctionUrlPermission:
    Type: AWS::Lambda::Permission
    Condition: HasImage
    Properties:
      Action: lambda:InvokeFunctionUrl
      FunctionName: !Ref WorkerFunction
      FunctionUrlAuthType: NONE
      Principal: '*'

  SelfUpdateSchedule:
    Type: AWS::Scheduler::Schedule
    Condition: SelfUpdateScheduled
    Properties:
      Name: !Sub ${InstallationName}-self-update
      GroupName: default
      Description: Daily signed Appliance control-plane image update check
      FlexibleTimeWindow:
        Mode: FLEXIBLE
        MaximumWindowInMinutes: 60
      ScheduleExpression: rate(1 day)
      State: ENABLED
      Target:
        Arn: !GetAtt WorkerFunction.Arn
        RoleArn: !GetAtt SelfUpdateSchedulerRole.Arn
        Input: '{"kind":"self-update-check"}'
        RetryPolicy:
          MaximumRetryAttempts: 0

  ApiServerLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: HasImage
    Properties:
      LogGroupName: !Sub /aws/lambda/${InstallationName}-api-server
      RetentionInDays: 30

  ApiServerFunction:
    Type: AWS::Lambda::Function
    Condition: HasImage
    DependsOn: ApiServerLogGroup
    Properties:
      FunctionName: !Sub ${InstallationName}-api-server
      PackageType: Image
      Code:
        ImageUri: !Ref ImageUri
      Role: !GetAtt SystemApiServerRole.Arn
      Architectures: [!Ref ImageArchitecture]
      Timeout: 30
      MemorySize: 2048
      EphemeralStorage:
        Size: 4096
      Environment:
        Variables:
          APPLIANCE_MODE: server
          APPLIANCE_DATA_BUCKET: !Ref DataBucket
          APPLIANCE_BASE_CONFIG_KEY: system/base-config.json
          SELF_UPDATE_ROLE_ARN: !If [UseScopedSystemRoles, !GetAtt SelfUpdateRole.Arn, '']
          SELF_UPDATE_POLICY: !Ref SelfUpdatePolicy
          PULUMI_BACKEND_URL: !Sub s3://${StateBucket}
          PULUMI_CONFIG_PASSPHRASE: ''
          APPLIANCE_TRUST_PROXY: 'true'
          WORKER_URL: !GetAtt WorkerFunctionUrl.FunctionUrl
          BOOTSTRAP_TOKEN: !Sub '{{resolve:secretsmanager:${BootstrapTokenSecret}:SecretString:token}}'

  ApiServerFunctionUrl:
    Type: AWS::Lambda::Url
    Condition: HasImage
    Properties:
      TargetFunctionArn: !GetAtt ApiServerFunction.Arn
      AuthType: NONE
      InvokeMode: BUFFERED

  ApiServerFunctionUrlPermission:
    Type: AWS::Lambda::Permission
    Condition: HasImage
    Properties:
      Action: lambda:InvokeFunctionUrl
      FunctionName: !Ref ApiServerFunction
      FunctionUrlAuthType: NONE
      Principal: '*'

Outputs:
  StateBucketName:
    Value: !Ref StateBucket
  StateBucketArn:
    Value: !GetAtt StateBucket.Arn
  DataBucketName:
    Value: !Ref DataBucket
  DataBucketArn:
    Value: !GetAtt DataBucket.Arn
  StateKmsKeyArn:
    Value: !GetAtt StateKmsKey.Arn
  StateKmsAliasName:
    Value: !Ref StateKmsAlias
  ImageRepositoryUrl:
    Value: !GetAtt ImageRepository.RepositoryUri
  SystemApiServerRoleArn:
    Value: !GetAtt SystemApiServerRole.Arn
  SystemWorkerRoleArn:
    Value: !GetAtt SystemWorkerRole.Arn
  UserAppliancePermissionsBoundaryArn:
    Value: !Ref UserAppliancePermissionsBoundary
  SelfUpdateRoleArn:
    Condition: UseScopedSystemRoles
    Value: !GetAtt SelfUpdateRole.Arn
  SelfUpdateCloudFormationRoleArn:
    Condition: UseScopedSystemRoles
    Value: !GetAtt SelfUpdateCloudFormationRole.Arn
  BootstrapTokenSecretArn:
    Value: !Ref BootstrapTokenSecret
  WorkerFunctionName:
    Condition: HasImage
    Value: !Ref WorkerFunction
  WorkerFunctionArn:
    Condition: HasImage
    Value: !GetAtt WorkerFunction.Arn
  WorkerFunctionUrl:
    Condition: HasImage
    Value: !GetAtt WorkerFunctionUrl.FunctionUrl
  ApiServerFunctionName:
    Condition: HasImage
    Value: !Ref ApiServerFunction
  ApiServerFunctionArn:
    Condition: HasImage
    Value: !GetAtt ApiServerFunction.Arn
  ApiServerFunctionUrl:
    Condition: HasImage
    Value: !GetAtt ApiServerFunctionUrl.FunctionUrl
