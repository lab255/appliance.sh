name: Release desktop app
on:
  # Dispatched by .github/workflows/release.yml right after nx-release
  # tags a new version (alongside the api-server image + CLI binary
  # builds). Also runnable on its own via the Actions UI for hot-fix
  # re-uploads of the desktop bundles.
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag the bundles attach to (e.g. v1.48.0). Defaults to the desktop package.json version with a leading "v".
        required: false
        default: ''
      unsigned:
        description: Build UNSIGNED, un-notarized macOS bundles (skips the Developer ID keychain import + notarization). Updater .sig generation via TAURI_SIGNING_PRIVATE_KEY is unaffected.
        type: boolean
        required: false
        default: false
      publish:
        description: Publish the built bundles to a GitHub Release. Disable for branch smoke tests.
        type: boolean
        required: false
        default: true

permissions:
  contents: write # to upload DMGs + the updater manifest to the release

concurrency:
  group: release-desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  credential-helper:
    uses: ./.github/workflows/credential-helper.yml

  # ----------------------------------------------------------------------
  # Per-arch macOS bundle build. The matrix mirrors the CLI's per-arch
  # compile targets (packages/cli/package.json -> compile:darwin-*):
  # aarch64 (Apple Silicon) and x86_64 (Intel). Each runs on a native
  # runner so the embedded Bun-compiled `appliance` sidecar matches the
  # bundle's arch — Tauri can't cross-compile the Rust shell the way Bun
  # cross-compiles the CLI.
  # ----------------------------------------------------------------------
  build:
    name: Build ${{ matrix.arch }} bundle
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            rust_target: aarch64-apple-darwin
            # Apple-Silicon runner. macos-14 was retired by GitHub (jobs are
            # cancelled instantly: "configuration macos-14-arm64-us-default
            # is not supported"); macos-15 is the supported arm64 image.
            runs_on: macos-15
          - arch: x86_64
            rust_target: x86_64-apple-darwin
            # Intel runner. macos-13 was retired by GitHub (jobs never
            # schedule and time out after 24h); macos-15-intel is the
            # supported native-Intel image, so the Bun sidecar arch
            # still matches the bundle without cross-compiling.
            runs_on: macos-15-intel
    runs-on: ${{ matrix.runs_on }}
    # The Developer ID cert (APPLE_CERTIFICATE + password), the notarization
    # creds (APPLE_ID/APPLE_PASSWORD/APPLE_TEAM_ID) and
    # the Tauri updater keys (TAURI_SIGNING_PRIVATE_KEY, TAURI_UPDATER_PUBKEY)
    # are scoped to the `publish` GitHub environment. Publishing runs opt in;
    # branch smoke tests do not request the protected environment, so their
    # secrets.* refs resolve to empty strings.
    environment: ${{ (github.event_name != 'workflow_dispatch' || inputs.publish) && 'publish' || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so the SDK postbuild can `git describe` a tag.
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            packages/credhelper
            packages/desktop/src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build the desktop's compile-time workspace deps from the nx
      # dependency graph: the CLI (bundled as the sidecar binary) and the
      # @appliance.sh/app React frontend (the Tauri frontendDist), plus
      # their transitive deps (sdk → infra → bootstrap → helper), all in
      # topological order. nx derives the order from the graph — no
      # hand-maintained list shared with release-cli-binaries.yml to drift.
      - name: Build desktop prerequisites
        run: pnpm exec nx run-many -t build -p '@appliance.sh/cli' '@appliance.sh/app'

      # nx-release bumps the package.json versions but does NOT touch the
      # Rust-side version sources (tauri.conf.json, Cargo.toml). The
      # updater compares the RUNNING app's version (from tauri.conf.json)
      # against the feed, so they must match the released package version
      # or every client thinks it's perpetually behind/ahead. Sync them
      # here from the single source of truth.
      - name: Sync bundle version from package.json
        run: node packages/desktop/scripts/sync-version.mjs

      # The committed tauri.conf.json carries a placeholder updater
      # pubkey (fail-safe: update checks reject everything). Release
      # builds inject the real public key so self-update actually works.
      - name: Inject updater public key
        env:
          TAURI_UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
        run: node packages/desktop/scripts/set-updater-pubkey.mjs

      # The release overlay enables updater artifacts, which makes Tauri
      # require TAURI_SIGNING_PRIVATE_KEY. Smoke tests deliberately have no
      # publish-environment secrets, so keep the ordinary bundles but disable
      # their updater archives and signatures.
      - name: Disable updater artifacts for non-publishing build
        if: github.event_name == 'workflow_dispatch' && !inputs.publish
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path = 'packages/desktop/src-tauri/tauri.release.conf.json';
          const config = JSON.parse(fs.readFileSync(path, 'utf8'));
          config.bundle.createUpdaterArtifacts = false;
          fs.writeFileSync(path, `${JSON.stringify(config, null, 2)}\n`);
          NODE

      # Build, Developer-ID-sign (hardened runtime), notarize + staple,
      # and emit signed updater artifacts. The Apple secrets are optional at
      # the script level: notarize-macos.mjs no-ops without them. Tauri does
      # require TAURI_SIGNING_PRIVATE_KEY when updater artifacts are enabled,
      # so the non-publishing step above disables those artifacts for smoke
      # tests. See packages/desktop/README.md -> Auto-update.
      - name: Build + sign + notarize bundle
        id: bundle
        working-directory: packages/desktop
        env:
          # --- Developer ID cert import (into a temp keychain, below) ---
          # Base64-encoded .p12 of the "Developer ID Application" cert +
          # private key, and its export password.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # --- Developer ID signing + notarization ---
          # No APPLE_SIGNING_IDENTITY secret: the signing scripts
          # (sign-staged.mjs, notarize-macos.mjs — see macos-signing.mjs)
          # derive the identity from the imported cert below, so a cert
          # rotation can't silently strand a stale identity string.
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # --- updater artifact signing (Tauri) ---
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # workflow_dispatch escape hatch: force an unsigned build even
          # when the APPLE_* secrets exist (e.g. cert expired mid-release).
          UNSIGNED: ${{ inputs.unsigned }}
        run: |
          set -euo pipefail
          if [ "${UNSIGNED:-false}" = "true" ]; then
            echo "unsigned=true — masking APPLE_* creds; keychain import and notarization will be skipped."
            unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_TEAM_ID APPLE_ID APPLE_PASSWORD
          fi
          # Import the Developer ID cert into a temporary keychain when the
          # secret is present; codesign can't see a cert that isn't in a
          # keychain. Skipped (with the rest of signing) when absent.
          if [ -n "${APPLE_CERTIFICATE:-}" ]; then
            KEYCHAIN_PATH="$RUNNER_TEMP/appliance-signing.keychain-db"
            security create-keychain -p "" "$KEYCHAIN_PATH"
            security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
            security unlock-keychain -p "" "$KEYCHAIN_PATH"
            echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
            security import "$RUNNER_TEMP/cert.p12" -P "${APPLE_CERTIFICATE_PASSWORD:-}" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
            security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain
            security set-key-partition-list -S apple-tool:,apple: -k "" "$KEYCHAIN_PATH" >/dev/null
          else
            echo "APPLE_CERTIFICATE not set — building an UNSIGNED, un-notarized bundle (expected for forks / dry runs)."
          fi
          pnpm run tauri:build:release
          # Record what signing this build actually attempted, so the guard
          # step can hard-fail if the expected artifacts don't materialize.
          # apple_signing reflects the post-UNSIGNED-mask state; updater
          # signing is independent (UNSIGNED does not touch the Tauri key).
          if [ -n "${APPLE_CERTIFICATE:-}" ]; then
            echo "apple_signing=expected" >> "$GITHUB_OUTPUT"
          else
            echo "apple_signing=skipped" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            echo "updater_signing=expected" >> "$GITHUB_OUTPUT"
          else
            echo "updater_signing=skipped" >> "$GITHUB_OUTPUT"
          fi

      # Fail LOUD when signing was configured but the outputs aren't actually
      # signed / notarized / updater-signed. A silent no-op (partial creds, a
      # Tauri version that stopped invoking notarize-macos, an expired cert
      # that imported but can't sign) would otherwise ship a bundle Gatekeeper
      # blocks or the updater can't verify. Forks with no secrets skip every
      # assertion (both signals are 'skipped'), preserving unsigned dry runs.
      - name: Guard — signing + notarization actually happened
        if: steps.bundle.outputs.apple_signing == 'expected' || steps.bundle.outputs.updater_signing == 'expected'
        working-directory: packages/desktop/src-tauri/target/release/bundle
        env:
          APPLE_SIGNING: ${{ steps.bundle.outputs.apple_signing }}
          UPDATER_SIGNING: ${{ steps.bundle.outputs.updater_signing }}
        run: |
          set -euo pipefail
          fail=0

          if [ "$APPLE_SIGNING" = "expected" ]; then
            APP=$(find macos -maxdepth 1 -name '*.app' | head -n1 || true)
            if [ -z "$APP" ]; then
              echo "::error::signing was configured but no .app was produced under macos/ — did tauri:build:release run?" >&2
              fail=1
            else
              # The whole bundle (shell + embedded sidecars) must verify as a
              # validly sealed Developer-ID signature, not an ad-hoc "-" one.
              if ! codesign --verify --deep --strict --verbose=2 "$APP"; then
                echo "::error::$APP failed codesign --verify --deep --strict." >&2
                fail=1
              fi
              if ! codesign -dvv "$APP" 2>&1 | grep -q 'Authority=Developer ID Application'; then
                echo "::error::$APP is not Developer-ID signed (ad-hoc / dev signatures fail Gatekeeper)." >&2
                codesign -dvv "$APP" 2>&1 | grep -E 'Authority=|Signature' >&2 || true
                fail=1
              fi
              # Stapled ticket = notarization succeeded AND is verifiable
              # offline. This transitively proves the hardened runtime, since
              # Apple won't notarize a bundle without it.
              if ! xcrun stapler validate "$APP"; then
                echo "::error::$APP has no stapled notarization ticket." >&2
                fail=1
              fi
              DMG=$(find dmg -maxdepth 1 -name '*.dmg' | head -n1 || true)
              if [ -n "$DMG" ] && ! xcrun stapler validate "$DMG"; then
                echo "::error::$DMG has no stapled notarization ticket." >&2
                fail=1
              fi
            fi
          fi

          if [ "$UPDATER_SIGNING" = "expected" ]; then
            SIG=$(find macos -maxdepth 1 -name '*.app.tar.gz.sig' | head -n1 || true)
            if [ -z "$SIG" ]; then
              echo "::error::TAURI_SIGNING_PRIVATE_KEY was set but no *.app.tar.gz.sig was produced — self-update would be unverifiable." >&2
              find macos -maxdepth 1 -type f >&2 || true
              fail=1
            fi
          fi

          [ "$fail" -eq 0 ] && echo "Signing guard passed — expected artifacts are present and valid."
          exit "$fail"

      - name: Stage release assets
        id: stage
        working-directory: packages/desktop/src-tauri/target/release/bundle
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/release-assets"
          mkdir -p "$OUT"
          # DMG: rename to an arch-tagged, stable asset name so the
          # release page is unambiguous and the updater manifest can
          # point at a predictable URL.
          DMG=$(find dmg -name '*.dmg' | head -n1 || true)
          if [ -n "$DMG" ]; then
            cp "$DMG" "$OUT/Appliance_${ARCH}.dmg"
          fi
          # Updater artifacts: Tauri emits a tarball + its detached .sig
          # next to the .app. These are what the updater downloads +
          # verifies. Absent when TAURI_SIGNING_PRIVATE_KEY wasn't set.
          TARBALL=$(find macos -name '*.app.tar.gz' | head -n1 || true)
          if [ -n "$TARBALL" ]; then
            cp "$TARBALL" "$OUT/Appliance_${ARCH}.app.tar.gz"
            cp "$TARBALL.sig" "$OUT/Appliance_${ARCH}.app.tar.gz.sig"
          fi
          # Checksums for the DMG so users can verify a manual download.
          ( cd "$OUT" && shasum -a 256 ./* > "checksums-${ARCH}.txt" )
          echo "out=$OUT" >> "$GITHUB_OUTPUT"
          ls -la "$OUT"

      - name: Upload per-arch artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.arch }}
          path: ${{ steps.stage.outputs.out }}
          if-no-files-found: warn

  # ----------------------------------------------------------------------
  # Windows x86_64 bundle. Produces the NSIS installer (the artifact a
  # non-technical user downloads and double-clicks) plus its updater
  # signature. The WSL2 microVM backend (packages/vm/src/backend/wsl.rs)
  # is compiled and bundled by the same vm:build/vm:bundle scripts the
  # macOS job runs — they are platform-aware.
  # ----------------------------------------------------------------------
  build-windows:
    needs: credential-helper
    env:
      APPLIANCE_CREDHELPER_BINARY: ${{ github.workspace }}/credential-helper/appliance-credhelper.exe
    name: Build windows-x86_64 bundle
    runs-on: windows-latest
    # Publishing runs opt in to the `publish` environment for the Tauri
    # updater secrets (TAURI_SIGNING_PRIVATE_KEY + TAURI_UPDATER_PUBKEY) and
    # the Azure Trusted Signing credentials (AZURE_TENANT_ID / AZURE_CLIENT_ID
    # / AZURE_CLIENT_SECRET secrets + AZURE_SIGNING_ENDPOINT / _ACCOUNT /
    # _PROFILE variables — the Lab255 profile OpenBook also signs with).
    # Branch smoke tests skip the protected environment, so they build
    # unsigned and skip the Authenticode guards.
    environment: ${{ (github.event_name != 'workflow_dispatch' || inputs.publish) && 'publish' || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            packages/credhelper
            packages/desktop/src-tauri
            packages/vm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download canonical Windows credential helper
        uses: actions/download-artifact@v4
        with:
          name: credential-helper-canonical
          path: credential-helper

      - name: Verify canonical Windows credential helper
        run: node packages/cli/scripts/verify-credential-helper-digest.mjs x86_64-pc-windows-msvc credential-helper/appliance-credhelper.exe

      - name: Build desktop prerequisites
        run: pnpm exec nx run-many -t build -p '@appliance.sh/cli' '@appliance.sh/app'

      - name: Sync bundle version from package.json
        run: node packages/desktop/scripts/sync-version.mjs

      - name: Inject updater public key
        env:
          TAURI_UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
        run: node packages/desktop/scripts/set-updater-pubkey.mjs

      - name: Disable updater artifacts for non-publishing build
        if: github.event_name == 'workflow_dispatch' && !inputs.publish
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path = 'packages/desktop/src-tauri/tauri.release.conf.json';
          const config = JSON.parse(fs.readFileSync(path, 'utf8'));
          config.bundle.createUpdaterArtifacts = false;
          fs.writeFileSync(path, `${JSON.stringify(config, null, 2)}\n`);
          NODE

      # ------------------------------------------------------------------
      # Authenticode (AP-202). Unsigned Windows binaries are blocked outright
      # by Smart App Control on fresh Windows 11 installs (CodeIntegrity
      # 3077/3033: installer -> appliance-desktop.exe, appliance.exe ->
      # appliance-credhelper.exe). Mirrors OpenBook's release.yml.
      # ------------------------------------------------------------------
      - name: Preflight — Windows Authenticode signing configuration
        shell: bash
        env:
          CONFIG_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          CONFIG_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          CONFIG_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          CONFIG_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          CONFIG_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          CONFIG_SIGNING_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
          WINDOWS_SIGNING_REQUIRED: ${{ vars.WINDOWS_SIGNING_REQUIRED }}
        run: |
          set -euo pipefail
          present=0
          missing=0
          for name in CONFIG_TENANT_ID CONFIG_CLIENT_ID CONFIG_CLIENT_SECRET CONFIG_SIGNING_ENDPOINT CONFIG_SIGNING_ACCOUNT CONFIG_SIGNING_PROFILE; do
            val="${!name}"
            val="${val//[[:space:]]/}"
            if [ -z "$val" ]; then missing=$((missing + 1)); else present=$((present + 1)); fi
          done
          if [ "$present" -gt 0 ] && [ "$missing" -gt 0 ]; then
            echo "::error::Windows signing configuration is partial ($present of 6 values set); refusing to build unsigned." >&2
            exit 1
          fi
          if [ "$missing" -eq 6 ]; then
            if [ "$(printf '%s' "$WINDOWS_SIGNING_REQUIRED" | tr -d '[:space:]')" = "1" ]; then
              echo "::error::WINDOWS_SIGNING_REQUIRED=1 but Windows signing configuration is absent." >&2
              exit 1
            fi
            echo "::warning::Windows build is UNSIGNED — Azure Trusted Signing is not configured for this run."
            echo "win_signing=0" >> "$GITHUB_ENV"
          else
            echo "Azure Trusted Signing configured — every Windows binary and the installer will be signed."
            echo "win_signing=1" >> "$GITHUB_ENV"
          fi

      # Fail in seconds on a wrong tenant / client ID / secret (AADSTS error in
      # the log) instead of after the trusted-signing-cli install + Rust build.
      - name: Verify Azure Trusted Signing credentials
        if: env.win_signing == '1'
        shell: bash
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
        run: node packages/desktop/scripts/win-sign.mjs --check-credentials

      - name: Install Azure Trusted Signing CLI
        if: env.win_signing == '1'
        shell: bash
        # Pinned; same version + flags OpenBook ships with. Upstream has since
        # renamed the crate to artifact-signing-cli.
        run: cargo install --locked trusted-signing-cli --version 0.9.0

      - name: Resolve signtool
        if: env.win_signing == '1'
        shell: pwsh
        run: |
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" |
            Where-Object { $_.Directory.Parent.Name -match '^\d+(\.\d+)+$' } |
            Sort-Object { [version]$_.Directory.Parent.Name } -Descending |
            Select-Object -First 1
          if (-not $signtool) { Write-Error 'signtool.exe not found'; exit 1 }
          "SIGNTOOL_PATH=$($signtool.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Seed pinned Azure Trusted Signing dlib
        if: env.win_signing == '1'
        shell: pwsh
        run: |
          $package = Join-Path $env:RUNNER_TEMP 'Microsoft.Trusted.Signing.Client.1.0.95.zip'
          Invoke-WebRequest -Uri 'https://www.nuget.org/api/v2/package/Microsoft.Trusted.Signing.Client/1.0.95' -OutFile $package
          # Same pin as OpenBook (SHA-256 computed from the NuGet package 2026-08-22).
          $expectedSha256 = '3bfcf1e0a3cb42af1692f0a8ed45c15de070c2de86f28a59b2795d904d8a920f'
          $actualSha256 = (Get-FileHash -Algorithm SHA256 $package).Hash.ToLowerInvariant()
          if ($actualSha256 -ne $expectedSha256) {
            Write-Error "Trusted Signing dlib SHA-256 mismatch: expected $expectedSha256, got $actualSha256"
            exit 1
          }
          $destination = Join-Path $env:USERPROFILE '.trusted-signing-cli\lib'
          New-Item -ItemType Directory -Path $destination -Force | Out-Null
          Expand-Archive -LiteralPath $package -DestinationPath $destination -Force

      # No Apple secrets here — notarize-macos.mjs skips itself off-darwin.
      # Authenticode: tauri.release.conf.json sets bundle.windows.signCommand
      # to scripts/win-sign.mjs, which the bundler runs for the main exe, both
      # externalBin sidecars (in place in src-tauri/binaries), the vm-bin .exe
      # resource, the uninstaller and the -setup.exe. Without the AZURE_* env
      # it no-ops (unsigned dry-run); a signing failure aborts the build.
      - name: Build bundle
        id: bundle
        working-directory: packages/desktop
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
          AZURE_CONFIG_DIR: ${{ runner.temp }}\azure-signing
          WINDOWS_SIGNING_REQUIRED: ${{ vars.WINDOWS_SIGNING_REQUIRED }}
          # Tauri swallows signCommand output without --verbose; win-sign.mjs
          # mirrors it here and the next step prints it if the build fails.
          WIN_SIGN_LOG: ${{ runner.temp }}\win-sign.log
        run: |
          set -euo pipefail
          pnpm run tauri:build:release
          # Record whether updater signing was configured, so the guard below
          # can hard-fail a real release whose installer came out unsigned.
          if [ -n "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            echo "updater_signing=expected" >> "$GITHUB_OUTPUT"
          else
            echo "updater_signing=skipped" >> "$GITHUB_OUTPUT"
          fi

      - name: Show Windows signing log
        if: failure() && steps.bundle.conclusion == 'failure'
        shell: bash
        run: |
          log="$RUNNER_TEMP/win-sign.log"
          if [ -f "$log" ]; then
            echo "::group::win-sign.log"; cat "$log"; echo "::endgroup::"
            grep -m1 'ERROR' "$log" | sed 's/^/::error::/' || true
          else
            echo "No win-sign.log — the bundle failed before any signing call."
          fi

      - name: Remove Azure signing credentials
        if: always()
        shell: pwsh
        run: Remove-Item -LiteralPath "${{ runner.temp }}\azure-signing" -Recurse -Force -ErrorAction SilentlyContinue

      # The CLI release cross-build and this native desktop build are separate
      # producers, so byte identity is asserted against the CLI package's baked
      # digest before the desktop artifact can stage. The bundler signs the
      # staged helper in place; the verifier strips the Authenticode table
      # before hashing (packages/cli/scripts/authenticode.mjs), so the pin over
      # the unsigned normalized build still covers every code byte.
      - name: Guard — bundled Windows helper matches CLI baked digest
        shell: bash
        run: >-
          node packages/cli/scripts/verify-credential-helper-digest.mjs
          x86_64-pc-windows-msvc
          packages/desktop/src-tauri/binaries/appliance-credhelper-x86_64-pc-windows-msvc.exe

      # Fail LOUD when updater signing was configured but produced no .sig —
      # the Windows installer IS the updater artifact, so an unsigned one
      # breaks self-update. Forks without the Tauri key skip this assertion.
      - name: Guard — updater signature exists
        if: steps.bundle.outputs.updater_signing == 'expected'
        working-directory: packages/desktop/src-tauri/target/release/bundle
        shell: bash
        run: |
          set -euo pipefail
          SIG=$(find nsis -maxdepth 1 -name '*-setup.exe.sig' | head -n1 || true)
          if [ -z "$SIG" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY was set but no *-setup.exe.sig was produced — Windows self-update would be unverifiable." >&2
            find nsis -maxdepth 1 -type f >&2 || true
            exit 1
          fi
          echo "Updater signature present: $SIG"

      - name: Install NSIS bundle silently
        id: install
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = Get-ChildItem 'packages/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe' |
            Select-Object -First 1
          if (-not $setup) { throw 'No NSIS *-setup.exe bundle was produced.' }

          $installer = Start-Process -FilePath $setup.FullName -ArgumentList '/S' -Wait -PassThru
          if ($installer.ExitCode -ne 0) { throw "NSIS installer exited $($installer.ExitCode)." }

          $installDir = Join-Path $env:LOCALAPPDATA 'Appliance'
          if (-not (Test-Path $installDir -PathType Container)) {
            throw "NSIS installer did not create expected currentUser directory: $installDir"
          }
          "install_dir=$installDir" >> $env:GITHUB_OUTPUT

      - name: Verify installed binaries (GUI launch skipped — no smoke flag)
        shell: pwsh
        env:
          INSTALL_DIR: ${{ steps.install.outputs.install_dir }}
        run: |
          $ErrorActionPreference = 'Stop'
          $installedFiles = @(Get-ChildItem $env:INSTALL_DIR -File -Force -Recurse | Sort-Object FullName)
          Write-Host 'Installed bundle files:'
          foreach ($file in $installedFiles) {
            $relative = [IO.Path]::GetRelativePath($env:INSTALL_DIR, $file.FullName)
            Write-Host "$relative ($($file.Length) bytes)"
          }

          $required = @(
            'appliance-desktop.exe',
            'appliance.exe',
            'appliance-credhelper.exe',
            'vm-bin\appliance-vm.exe'
          )
          foreach ($relative in $required) {
            $path = Join-Path $env:INSTALL_DIR $relative
            if (-not (Test-Path $path -PathType Leaf)) { throw "Installed bundle is missing $relative" }
          }

          & node packages/cli/scripts/verify-credential-helper-digest.mjs `
            x86_64-pc-windows-msvc `
            (Join-Path $env:INSTALL_DIR 'appliance-credhelper.exe')
          if ($LASTEXITCODE -ne 0) { throw 'Installed desktop credential helper failed the CLI baked-digest guard.' }

          # AP-202: when signing was configured, every PE that ships — the
          # installer plus every installed .exe/.dll — must carry a VALID
          # Lab255 Authenticode signature. Smart App Control blocks any one
          # unsigned child process, so a single gap breaks the install.
          if ($env:win_signing -eq '1') {
            $setup = Get-ChildItem 'packages/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe' | Select-Object -First 1
            $pe = @($setup) + @(Get-ChildItem $env:INSTALL_DIR -File -Recurse -Include '*.exe', '*.dll')
            $bad = @()
            foreach ($file in $pe) {
              $sig = Get-AuthenticodeSignature -LiteralPath $file.FullName
              $subject = if ($sig.SignerCertificate) { $sig.SignerCertificate.Subject } else { '<none>' }
              Write-Host "$($sig.Status)  $($file.Name)  $subject"
              if ($sig.Status -ne 'Valid' -or $subject -notmatch 'Lab255') { $bad += $file.FullName }
            }
            if ($bad.Count -gt 0) { throw "Authenticode guard: unsigned or foreign-signed binaries: $($bad -join ', ')" }
            "Authenticode: $($pe.Count) shipped PE files carry a valid Lab255 signature." >> $env:GITHUB_STEP_SUMMARY
          } else {
            Write-Host '::warning::Authenticode guard skipped — this build is unsigned.'
          }

          $stagedApiServer = 'packages/desktop/src-tauri/apiserver-bin'
          $apiServerFiles = @(Get-ChildItem $stagedApiServer -File -Recurse -ErrorAction SilentlyContinue)
          foreach ($file in $apiServerFiles) {
            $relative = [IO.Path]::GetRelativePath($stagedApiServer, $file.FullName)
            $installed = Join-Path $env:INSTALL_DIR (Join-Path 'apiserver-bin' $relative)
            if (-not (Test-Path $installed -PathType Leaf)) {
              throw "Installed bundle is missing staged apiserver-bin\$relative"
            }
          }

          function Get-VersionOutput([string] $path) {
            $output = (& $path --version 2>&1 | Out-String).Trim()
            if ($LASTEXITCODE -ne 0) { throw "$path --version exited $LASTEXITCODE." }
            if ([string]::IsNullOrWhiteSpace($output)) { throw "$path --version printed no version." }
            return $output
          }

          $desktopVersion = (Get-Content 'packages/desktop/package.json' | ConvertFrom-Json).version
          $vmManifest = Get-Content 'packages/vm/Cargo.toml' -Raw
          $vmVersion = [regex]::Match($vmManifest, '(?m)^version\s*=\s*"([^"]+)"').Groups[1].Value
          $sidecarVersion = Get-VersionOutput (Join-Path $env:INSTALL_DIR 'appliance.exe')
          $vmVersionOutput = Get-VersionOutput (Join-Path $env:INSTALL_DIR 'vm-bin\appliance-vm.exe')
          if ($sidecarVersion -notmatch "(?m)^v?$([regex]::Escape($desktopVersion))$") {
            throw "Sidecar version '$sidecarVersion' does not match desktop package version '$desktopVersion'."
          }
          if ($vmVersionOutput -notmatch "(?m)^appliance-vm $([regex]::Escape($vmVersion))$") {
            throw "VM version '$vmVersionOutput' does not match packages/vm/Cargo.toml '$vmVersion'."
          }

          @(
            '### Windows NSIS installed-bundle smoke test',
            '',
            "Install directory: ``$env:INSTALL_DIR``",
            '',
            '#### Runnable versions',
            '',
            "- CLI sidecar: ``$sidecarVersion``",
            "- VM engine: ``$vmVersionOutput``",
            '',
            '#### Installed files',
            ''
          ) >> $env:GITHUB_STEP_SUMMARY
          $installedFiles | ForEach-Object {
            $relative = [IO.Path]::GetRelativePath($env:INSTALL_DIR, $_.FullName)
            "- ``$relative`` ($($_.Length) bytes)" >> $env:GITHUB_STEP_SUMMARY
          }

      - name: Uninstall smoke-tested bundle
        if: always()
        shell: pwsh
        run: |
          $installDir = Join-Path $env:LOCALAPPDATA 'Appliance'
          $uninstaller = Join-Path $installDir 'uninstall.exe'
          if (Test-Path $uninstaller -PathType Leaf) {
            $process = Start-Process -FilePath $uninstaller -ArgumentList '/S' -Wait -PassThru
            if ($process.ExitCode -ne 0) { throw "NSIS uninstaller exited $($process.ExitCode)." }
          } else {
            Write-Host "No installed uninstaller to run at $uninstaller"
          }

      - name: Stage release assets
        id: stage
        working-directory: packages/desktop/src-tauri/target/release/bundle
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/release-assets"
          mkdir -p "$OUT"
          # NSIS installer: the download for humans AND the updater
          # artifact (Tauri v2 updates in place from the -setup.exe).
          SETUP=$(find nsis -name '*-setup.exe' | head -n1 || true)
          if [ -n "$SETUP" ]; then
            cp "$SETUP" "$OUT/Appliance_x86_64-setup.exe"
            if [ -f "$SETUP.sig" ]; then
              cp "$SETUP.sig" "$OUT/Appliance_x86_64-setup.exe.sig"
            fi
          fi
          ( cd "$OUT" && sha256sum ./* > "checksums-windows-x86_64.txt" )
          echo "out=$OUT" >> "$GITHUB_OUTPUT"
          ls -la "$OUT"

      - name: Upload per-arch artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-x86_64
          path: ${{ steps.stage.outputs.out }}
          if-no-files-found: warn

  # ----------------------------------------------------------------------
  # Collect every platform, build the single `latest.json` updater
  # manifest that points at each platform's signed artifact, and publish
  # everything to the GitHub Release for the tag.
  # ----------------------------------------------------------------------
  publish:
    name: Publish bundles + updater manifest
    if: inputs.publish
    needs: [build, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # release-cli-binaries.yml owns publishing shared credential-helper assets.
      - name: Download desktop arch artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: dist-artifacts

      - name: Resolve release tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_TAG:-}" ]; then
            TAG="${INPUT_TAG}"
          else
            VERSION=$(node -p "require('./packages/desktop/package.json').version")
            TAG="v${VERSION}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "Releasing desktop bundles for ${TAG}"

      # Assemble latest.json from the per-arch .sig files. The updater
      # keys platforms as `<os>-<arch>`; macOS aarch64 → darwin-aarch64,
      # x86_64 → darwin-x86_64. The `url` points at the arch tarball on
      # this release; `signature` is the verbatim .sig content.
      - name: Build updater manifest (latest.json)
        id: manifest
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          VERSION: ${{ steps.tag.outputs.version }}
          REPO: ${{ github.repository }}
        run: node .github/scripts/build-updater-manifest.mjs

      - name: Ensure release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists."
          else
            echo "Creating release ${TAG}."
            gh release create "${TAG}" --title "${TAG}" --generate-notes
          fi

      - name: Upload bundles + manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          # Flatten the downloaded artifacts and upload every DMG, tarball,
          # .sig, checksum file, plus the assembled latest.json. --clobber
          # so a re-run updates the release in place.
          ASSETS=$(find dist-artifacts -type f)
          # latest.json must be present for the updater endpoint to resolve.
          gh release upload "${TAG}" --clobber latest.json $ASSETS
