name: Pull Request
on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: read # for checkout

jobs:
  verify:
    name: Pull Request
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write # to be able to comment on released issues
      pull-requests: write # to be able to comment on released pull requests
      id-token: write # to enable use of OIDC for npm provenance
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: Install pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      # The CLI build compiles a standalone binary with `bun build
      # --compile`, and the desktop build copies that binary in via
      # copy-cli.mjs — so the PR build needs Bun on PATH just like
      # release-cli-binaries.yml does.
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # The TypeScript half of the `pnpm verify` green bar. The Rust half
      # runs on macOS in verify-rust below, where packages/vm is developed
      # and the Virtualization.framework backend compiles.
      - name: Build
        run: pnpm run build
      - name: Typecheck
        run: pnpm exec nx run-many --target=typecheck --all
      - name: Check linting and code style
        run: pnpm run lint:check
      - name: Test
        run: pnpm exec nx run-many --target=test --all

  runtime-samples:
    name: Runtime samples
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Install pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # `appliance builder package` runs `docker buildx build --output type=oci`,
      # which the default docker driver cannot export. Use a container driver.
      - name: Set up Docker Buildx (docker-container driver)
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          driver: docker-container
          install: true
      - name: Build and verify Runtime samples (Docker required)
        env:
          OUT: ${{ runner.temp }}/runtime-samples
        # CI requires Docker (`--require-docker`); local builds skip with a message.
        run: scripts/build-runtime-samples.sh --require-docker
      - name: Upload Runtime sample bundles
        uses: actions/upload-artifact@v4
        with:
          name: runtime-samples
          path: ${{ runner.temp }}/runtime-samples/*.appliance.zip
          if-no-files-found: error
          retention-days: 7

  verify-rust:
    name: Verify (Rust crates)
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            packages/credential-store
            packages/credhelper
            packages/vm
      - name: cargo build / test / clippy (credential store)
        working-directory: packages/credential-store
        run: |
          cargo build --all-features
          cargo test --all-features
          cargo clippy --all-features --all-targets -- -D warnings
      - name: cargo build / test / clippy (credential helper)
        working-directory: packages/credhelper
        run: |
          cargo build
          cargo test
          cargo clippy --all-targets -- -D warnings
      - name: cargo build / test / clippy
        working-directory: packages/vm
        run: |
          cargo build
          cargo test
          cargo clippy -- -D warnings

  windows:
    name: Windows desktop + CLI
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            packages/credential-store
            packages/credhelper
            packages/desktop/src-tauri
            packages/vm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build desktop prerequisites
        run: >-
          pnpm exec nx run-many -t build -p
          '@appliance.sh/sdk'
          '@appliance.sh/infra'
          '@appliance.sh/helper'
          '@appliance.sh/cli'
          '@appliance.sh/app'
      - name: Test desktop and CLI packages
        run: >-
          pnpm exec nx run-many -t test -p
          '@appliance.sh/cli'
          '@appliance.sh/app'
          '@appliance.sh/desktop'
          '@appliance.sh/helper'
      # cargo check runs Tauri's build script, which only needs its declared
      # sidecar/resource paths to exist; real bundles are covered by release CI.
      - name: Prepare Tauri check resources
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force packages/desktop/src-tauri/binaries | Out-Null
          New-Item -ItemType Directory -Force packages/desktop/src-tauri/vm-bin | Out-Null
          New-Item -ItemType Directory -Force packages/desktop/src-tauri/apiserver-bin | Out-Null
          New-Item -ItemType File -Force packages/desktop/src-tauri/binaries/appliance-x86_64-pc-windows-msvc.exe | Out-Null
          New-Item -ItemType File -Force packages/desktop/src-tauri/binaries/appliance-credhelper-x86_64-pc-windows-msvc.exe | Out-Null
          New-Item -ItemType File -Force packages/desktop/src-tauri/vm-bin/appliance-vm.exe | Out-Null
      - name: Check desktop Rust
        run: cargo check --manifest-path packages/desktop/src-tauri/Cargo.toml
      - name: Test credential store Rust
        run: >-
          cargo test --manifest-path packages/credential-store/Cargo.toml
          --all-features
      - name: Test credential helper Rust
        run: >-
          cargo test --manifest-path packages/credhelper/Cargo.toml
      - name: Check microVM Rust
        run: cargo check --manifest-path packages/vm/Cargo.toml
