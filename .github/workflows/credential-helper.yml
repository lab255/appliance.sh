name: Credential helper reproducibility
on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Credential helper (linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: x86_64-pc-windows-msvc
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Cache verified sysroot archive
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/credhelper-sysroot/windows-msvc-sysroot-2026-08-07.tar.xz
          key: credhelper-sysroot-${{ runner.os }}-${{ hashFiles('packages/cli/scripts/credential-helper-sysroot.sha256') }}
      # No Cargo target cache: every PR must reproduce the checked-in pin from
      # source, including transitive credential-store and Cargo.lock changes.
      - name: Build canonical recipe and check baked digest
        shell: bash
        env:
          APPLIANCE_CREDHELPER_CACHE_DIR: ${{ runner.temp }}/credhelper-sysroot
        run: pnpm --filter @appliance.sh/cli credhelper:digest -- --check
      # Preserve failed digest checks for binary-level diagnosis without making
      # failed builds available to the canonical agreement/publish job.
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: credential-helper-linux
          path: |
            packages/credhelper/target/x86_64-pc-windows-msvc/release/appliance-credhelper.exe
            packages/credhelper/target/x86_64-pc-windows-msvc/release/appliance-credhelper.exe.sha256
          if-no-files-found: error
          retention-days: 7
      - name: Preserve diagnostic linker map
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: helper-link-map-linux
          path: packages/credhelper/target/credential-helper.map
          if-no-files-found: warn
          retention-days: 7

  windows:
    name: Credential helper (windows)
    needs: build
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: credential-helper-linux
          path: credential-helper
      # Cargo's host build-unit metadata affects target symbol identities even
      # with pinned Rust/lld. Verify the ONE producer's bytes on Windows rather
      # than introducing a second native/cross build as a release input.
      - name: Check canonical digest on Windows
        shell: bash
        env:
          APPLIANCE_CREDHELPER_BINARY: ${{ github.workspace }}/credential-helper/appliance-credhelper.exe
        run: pnpm --filter @appliance.sh/cli credhelper:digest -- --check
      - name: Run the canonical Windows executable
        run: ./credential-helper/appliance-credhelper.exe --help
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: credential-helper-windows
          path: |
            credential-helper/appliance-credhelper.exe
            credential-helper/appliance-credhelper.exe.sha256
          if-no-files-found: error
          retention-days: 7

  agree:
    name: Credential helper byte agreement
    needs: [build, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - uses: actions/download-artifact@v4
        with:
          pattern: credential-helper-*
          path: helpers
      - name: Assert Linux and Windows agree before releasing the canonical artifact
        run: |
          set -euo pipefail
          cmp helpers/credential-helper-linux/appliance-credhelper.exe helpers/credential-helper-windows/appliance-credhelper.exe
          node packages/cli/scripts/verify-credential-helper-digest.mjs x86_64-pc-windows-msvc helpers/credential-helper-linux/appliance-credhelper.exe
          cd helpers/credential-helper-linux
          sha256sum appliance-credhelper.exe > appliance-credhelper.exe.sha256
      # Both CLI and desktop consume this exact layout. Only the Linux build
      # becomes a release input; Windows independently verifies and runs it.
      - uses: actions/upload-artifact@v4
        with:
          name: credential-helper-canonical
          path: helpers/credential-helper-linux/*
          if-no-files-found: error
          retention-days: 7
