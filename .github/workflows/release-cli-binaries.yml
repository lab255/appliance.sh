name: Release CLI binaries
on:
  # Dispatched by .github/workflows/release.yml right after nx-release
  # tags a new version and the api-server image build kicks off — see
  # the `Dispatch CLI binaries build` step there. Also runnable on its
  # own via the Actions UI for hot-fix re-uploads.
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag the binaries attach to (e.g. v1.42.0). Defaults to the cli package.json version with a leading "v".
        required: false
        default: ''
      publish:
        description: Upload assets to the GitHub release; signing is added only when AP-226's protected secret exists. Disable for a build-only dry run.
        type: boolean
        required: false
        default: true
      image_manifest_digest:
        description: Optional sha256:... GHCR multi-arch manifest digest override; otherwise the workflow waits for the sibling image workflow.
        required: false
        default: ''
      require_signature:
        description: Fail publishing when APPLIANCE_RELEASE_SIGNING_KEY is absent. AP-226 flips this default to true after provisioning.
        type: boolean
        required: false
        default: false
      image_digest_poll_attempts:
        description: Number of GHCR manifest-resolution attempts before signing fails.
        type: number
        required: false
        default: 40
      image_digest_poll_seconds:
        description: Seconds between GHCR manifest-resolution attempts.
        type: number
        required: false
        default: 15

permissions:
  contents: write # to upload assets to the release
  packages: read # resolve the sibling api-server image manifest digest

concurrency:
  group: release-cli-binaries-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build + publish CLI binaries
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so the SDK postbuild can `git describe` a tag.
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Rust for Windows credential helper
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache credential-helper Cargo inputs
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/credhelper

      - name: Install pinned Windows cross-builder
        run: cargo install cargo-xwin --version 0.23.1 --locked

      # TODO(AP-202): Authenticode-sign the Windows helper before upload.
      # Until then, the baked SHA-256 is the release trust boundary.
      - name: Build + verify Windows credential helper
        env:
          APPLIANCE_CREDHELPER_CACHE_DIR: ${{ runner.temp }}/appliance-credhelper-digest
        run: pnpm --filter @appliance.sh/cli credhelper:digest -- --check

      - name: Stage Windows credential helper
        run: |
          set -euo pipefail
          ASSET=appliance-credhelper-x86_64-pc-windows-msvc.exe
          SOURCE=packages/credhelper/target/x86_64-pc-windows-msvc/release/appliance-credhelper.exe
          mkdir -p packages/cli/dist
          cp "$SOURCE" "packages/cli/dist/$ASSET"
          DIGEST=$(sha256sum "packages/cli/dist/$ASSET" | cut -d ' ' -f 1)
          printf '%s  %s\n' "$DIGEST" "$ASSET" > "packages/cli/dist/$ASSET.sha256"

      # The CLI release cross-build and this native desktop build are separate
      # until AP-202 signs both. Byte identity is therefore asserted against
      # the CLI package's baked digest before the desktop artifact can stage.
      - name: Guard — staged Windows helper matches CLI baked digest
        run: >-
          node packages/cli/scripts/verify-credential-helper-digest.mjs
          x86_64-pc-windows-msvc
          packages/cli/dist/appliance-credhelper-x86_64-pc-windows-msvc.exe

      # Build the CLI and its workspace deps in topological order straight
      # from the nx dependency graph (sdk → infra → bootstrap → helper →
      # cli) so every workspace import resolves to fresh dist at compile
      # time. nx is the single source of truth for the order — no
      # hand-maintained list to drift out of sync with the graph. nx prints
      # each task it runs, so a break is still easy to trace.
      - name: Build CLI prerequisites
        run: pnpm exec nx build @appliance.sh/cli

      # `bun build --compile --target=...` bundles each binary with
      # its matching Bun runtime, so we can cross-compile every
      # platform from a single Linux runner. Asset names match the
      # Rust target-triple convention so the desktop's runtime
      # downloader can derive them via std::env::consts.
      - name: Compile per-platform binaries
        run: pnpm --filter @appliance.sh/cli run compile:all

      # The installed CLI (a bun single-binary) can't build the guest
      # control-plane locally, so it downloads these from the release —
      # see packages/cli/src/utils/api-server-artifact.ts stageFromRelease.
      # Build the api-server + console workspaces (the guest compile
      # bundles their dist), cross-compile both linux guest binaries, and
      # tar the web console the same way the repo path does (dist contents
      # at the archive root, matching tarGzDirectory).
      - name: Build guest prerequisites
        run: pnpm exec nx run-many -t build -p @appliance.sh/api-server @appliance.sh/console

      - name: Compile api-server guest binaries
        run: pnpm --filter @appliance.sh/api-server run compile:guest

      - name: Package web console bundle
        run: tar -czf packages/api-server/dist/guest/appliance-console.tar.gz -C packages/console/dist .

      - name: Compute guest SHA256SUMS
        working-directory: packages/api-server/dist/guest
        run: >-
          sha256sum
          appliance-api-server-linux-x64
          appliance-api-server-linux-arm64
          appliance-console.tar.gz
          > SHA256SUMS

      - name: Resolve release tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_TAG:-}" ]; then
            TAG="${INPUT_TAG}"
          else
            VERSION=$(node -p "require('./packages/cli/package.json').version")
            TAG="v${VERSION}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Releasing CLI binaries for ${TAG}"

      - name: Guard published builds to their tag ref
        if: ${{ inputs.publish }}
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/tags/$TAG" ]; then
            echo "::error::publish=true requires workflow ref refs/tags/$TAG (got $GITHUB_REF)"
            exit 1
          fi

      - name: Warn for unsigned build-only dry run
        if: ${{ ! inputs.publish }}
        run: echo "::warning::publish=false — skipping release signing and every GitHub Release upload"

      - name: Self-check release signing code for dry runs
        if: ${{ ! inputs.publish }}
        run: node packages/sdk/scripts/create-control-plane-release.mjs --check

      - name: Preserve guest assets for protected signing job
        if: ${{ inputs.publish }}
        uses: actions/upload-artifact@v4
        with:
          name: control-plane-release-assets
          path: |
            packages/api-server/dist/guest/appliance-api-server-linux-x64
            packages/api-server/dist/guest/appliance-api-server-linux-arm64
            packages/api-server/dist/guest/appliance-console.tar.gz
            packages/api-server/dist/guest/SHA256SUMS
          if-no-files-found: error
          retention-days: 1

      # `gh release upload` requires an existing release. nx-release
      # creates the GitHub Release before this workflow runs; the
      # `create --notes-file` fallback handles manual re-runs against
      # a tag without a release.
      - name: Ensure release exists
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists."
          else
            echo "Creating release ${TAG}."
            gh release create "${TAG}" --title "${TAG}" --generate-notes
          fi

      - name: Upload binaries
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        working-directory: packages/cli/dist
        run: |
          set -euo pipefail
          ASSETS=(
            appliance-aarch64-apple-darwin
            appliance-x86_64-apple-darwin
            appliance-x86_64-unknown-linux-gnu
            appliance-aarch64-unknown-linux-gnu
            appliance-x86_64-pc-windows-msvc.exe
            appliance-credhelper-x86_64-pc-windows-msvc.exe
            appliance-credhelper-x86_64-pc-windows-msvc.exe.sha256
          )
          # `--clobber` overwrites pre-existing assets so a re-run of
          # this workflow (e.g. fixing a build issue) updates the
          # release in place instead of failing on a duplicate name.
          gh release upload "${TAG}" --clobber "${ASSETS[@]}"

  sign-control-plane-release:
    name: Sign control-plane release metadata
    needs: build
    if: ${{ inputs.publish && startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    environment: release-signing
    permissions:
      contents: write
      packages: read
    steps:
      - name: Checkout the release tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build signing SDK
        run: pnpm exec nx build @appliance.sh/sdk

      - name: Download verified build outputs
        uses: actions/download-artifact@v4
        with:
          name: control-plane-release-assets
          path: packages/api-server/dist/guest

      - name: Decide whether signing is provisioned
        id: signing-key
        env:
          APPLIANCE_RELEASE_SIGNING_KEY: ${{ secrets.APPLIANCE_RELEASE_SIGNING_KEY }}
          REQUIRE_SIGNATURE: ${{ inputs.require_signature }}
        run: |
          set -euo pipefail
          if [ -n "${APPLIANCE_RELEASE_SIGNING_KEY:-}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "available=false" >> "$GITHUB_OUTPUT"
          echo "::warning::UNSIGNED release — AP-226 not provisioned"
          echo "## ⚠️ UNSIGNED release — AP-226 not provisioned" >> "$GITHUB_STEP_SUMMARY"
          echo "Guest binaries and SHA256SUMS will be uploaded without a control-plane payload or envelope." >> "$GITHUB_STEP_SUMMARY"
          if [ "$REQUIRE_SIGNATURE" = "true" ]; then
            echo "::error::require_signature=true but APPLIANCE_RELEASE_SIGNING_KEY is absent"
            exit 1
          fi

      - name: Set up Docker Buildx for manifest validation
        if: ${{ steps.signing-key.outputs.available == 'true' }}
        uses: docker/setup-buildx-action@v3

      - name: Resolve and validate api-server manifest digest
        if: ${{ steps.signing-key.outputs.available == 'true' }}
        id: image
        env:
          INPUT_DIGEST: ${{ inputs.image_manifest_digest }}
          POLL_ATTEMPTS: ${{ inputs.image_digest_poll_attempts }}
          POLL_SECONDS: ${{ inputs.image_digest_poll_seconds }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          set -euo pipefail
          OWNER_LOWER=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/${OWNER_LOWER}/api-server"
          VERSION="${TAG#v}"
          ACTUAL=""
          for attempt in $(seq 1 "$POLL_ATTEMPTS"); do
            ACTUAL=$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" 2>/dev/null | awk '$1 == "Digest:" { print $2; exit }')
            [ -n "$ACTUAL" ] && break
            echo "Waiting for sibling api-server image ${IMAGE}:${VERSION} (${attempt}/${POLL_ATTEMPTS})"
            sleep "$POLL_SECONDS"
          done
          if ! echo "$ACTUAL" | grep -qE '^sha256:[0-9a-f]{64}$'; then
            echo "::error::Could not resolve a valid multi-arch manifest digest for ${IMAGE}:${VERSION}"
            exit 1
          fi
          if [ -n "${INPUT_DIGEST:-}" ] && [ "$INPUT_DIGEST" != "$ACTUAL" ]; then
            echo "::error::image_manifest_digest override $INPUT_DIGEST does not match GHCR $ACTUAL"
            exit 1
          fi
          echo "repository=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "digest=${ACTUAL}" >> "$GITHUB_OUTPUT"

      - name: Derive monotonic semver generation
        if: ${{ steps.signing-key.outputs.available == 'true' }}
        id: generation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+([+-].*)?$'; then
            echo "::error::release tag is not semver: $TAG"
            exit 1
          fi
          IFS=. read -r MAJOR MINOR PATCH_REST <<< "$VERSION"
          PATCH="${PATCH_REST%%[-+]*}"
          if [ "$MINOR" -ge 1000 ] || [ "$PATCH" -ge 1000 ]; then
            echo "::error::minor and patch must be below 1000 for release generation"
            exit 1
          fi
          GENERATION=$((10#$MAJOR * 1000000 + 10#$MINOR * 1000 + 10#$PATCH))
          PREVIOUS=""
          while IFS= read -r CANDIDATE; do
            [ "$CANDIDATE" = "$TAG" ] && continue
            if gh release download "$CANDIDATE" --pattern control-plane-release.json --output "$RUNNER_TEMP/previous-release.json" 2>/dev/null; then
              PREVIOUS=$(node -e "const p=require(process.argv[1]); if(!Number.isSafeInteger(p.generation)) process.exit(1); process.stdout.write(String(p.generation))" "$RUNNER_TEMP/previous-release.json")
              break
            fi
          done < <(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq '.[].tag_name')
          echo "generation=$GENERATION" >> "$GITHUB_OUTPUT"
          echo "previous=$PREVIOUS" >> "$GITHUB_OUTPUT"

      - name: Sign control-plane release metadata
        if: ${{ steps.signing-key.outputs.available == 'true' }}
        env:
          APPLIANCE_RELEASE_SIGNING_KEY: ${{ secrets.APPLIANCE_RELEASE_SIGNING_KEY }}
          RELEASE_ASSET_DIR: ${{ github.workspace }}/packages/api-server/dist/guest
          RELEASE_OUTPUT_DIR: ${{ github.workspace }}/packages/api-server/dist/guest
          RELEASE_VERSION: ${{ needs.build.outputs.tag }}
          RELEASE_GENERATION: ${{ steps.generation.outputs.generation }}
          RELEASE_PREVIOUS_GENERATION: ${{ steps.generation.outputs.previous }}
          RELEASE_IMAGE_REPOSITORY: ${{ steps.image.outputs.repository }}
          RELEASE_IMAGE_MANIFEST_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          RELEASE_NOT_BEFORE=$(date -u +%Y-%m-%dT%H:%M:%SZ) \
          RELEASE_EXPIRES=$(date -u -d '+365 days' +%Y-%m-%dT%H:%M:%SZ) \
          node packages/sdk/scripts/create-control-plane-release.mjs

      # Keep the guest binaries and their signed evidence out of the release
      # until this single upload. A pinned CLI can therefore never observe a
      # binary-only publication window while the signing job is still running.
      - name: Upload guest release assets in one pass
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.build.outputs.tag }}
          SIGNED: ${{ steps.signing-key.outputs.available }}
        working-directory: packages/api-server/dist/guest
        run: |
          set -euo pipefail
          ASSETS=(
            appliance-api-server-linux-x64
            appliance-api-server-linux-arm64
            appliance-console.tar.gz
            SHA256SUMS
          )
          if [ "$SIGNED" = "true" ]; then
            ASSETS+=(control-plane-release.json control-plane-release.sig.json)
          fi
          gh release upload "$TAG" --clobber "${ASSETS[@]}"

  build-credential-helper:
    name: Build + publish credential helper (${{ matrix.triple }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - triple: aarch64-apple-darwin
            runs_on: macos-14
            extension: ''
          - triple: x86_64-apple-darwin
            runs_on: macos-15-intel
            extension: ''
          - triple: x86_64-unknown-linux-gnu
            runs_on: ubuntu-latest
            extension: ''
          - triple: aarch64-unknown-linux-gnu
            runs_on: ubuntu-24.04-arm
            extension: ''
    runs-on: ${{ matrix.runs_on }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: ${{ matrix.triple }}

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/credhelper

      - name: Build credential helper (native target)
        run: >-
          cargo build --locked --release
          --manifest-path packages/credhelper/Cargo.toml
          --target ${{ matrix.triple }}

      - name: Stage binary + SHA-256
        id: stage
        shell: bash
        env:
          TRIPLE: ${{ matrix.triple }}
          EXTENSION: ${{ matrix.extension }}
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/credential-helper-release"
          ASSET="appliance-credhelper-${TRIPLE}${EXTENSION}"
          SOURCE="packages/credhelper/target/${TRIPLE}/release/appliance-credhelper${EXTENSION}"
          mkdir -p "$OUT"
          cp "$SOURCE" "$OUT/$ASSET"
          if command -v sha256sum >/dev/null 2>&1; then
            DIGEST=$(sha256sum "$OUT/$ASSET" | cut -d ' ' -f 1)
          else
            DIGEST=$(shasum -a 256 "$OUT/$ASSET" | cut -d ' ' -f 1)
          fi
          printf '%s  %s\n' "$DIGEST" "$ASSET" > "$OUT/$ASSET.sha256"
          echo "out=$OUT" >> "$GITHUB_OUTPUT"
          echo "asset=$ASSET" >> "$GITHUB_OUTPUT"

      - name: Upload helper + SHA-256
        if: ${{ inputs.publish }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.build.outputs.tag }}
          OUT: ${{ steps.stage.outputs.out }}
          ASSET: ${{ steps.stage.outputs.asset }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" --clobber "$OUT/$ASSET" "$OUT/$ASSET.sha256"
